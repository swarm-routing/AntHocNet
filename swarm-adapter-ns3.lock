# The swarm-routing/swarm-adapter-ns3 release AntHocNet's ns-3 module builds on:
# the ns-3 contrib module swarm-core (SwarmRoutingBase, S10 of #1019), which
# `make install-ns3` installs as contrib/swarm-core (tools/swarm_core.py
# module). swarm-core.lock names swarm-core's own release, the core/ that
# core/ builds on; the two were one repository until swarm-core moved out
# (swarm-routing/swarm-adapter-ns3#231, swarm-routing/.github#691). Never edit
# it by hand: written by swarm-routing/.github tools/checks/release_lock.py
# (render, every value read from the release); org-bot's release-lock task
# opens the bump PR when a newer adapter release is out.
