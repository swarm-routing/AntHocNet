# Dependabot — keeps the supply chain pinned in workflows/images fresh (#330).
#
# Scope decisions:
#   - github-actions: workflow `uses:` lines are pinned to full commit SHAs
#     (tags can be repointed); Dependabot bumps the SHA and the trailing
#     `# vX.Y.Z` comment together. `github/codeql-action/*` (init, analyze,
#     upload-sarif) bump in one grouped PR: init and analyze must run the same
#     version, so a PR bumping one alone can never go green (#906).
#   - docker: none. This repo builds no image since #866 (release and campaign
#     images come from swarm-routing/.github's reusable-ns3-image.yml, FROM a
#     pinned ns3-dev digest resolved at build time).
#   - pip: the Python tool pins live in requirements/: one `<tool>.in` pin
#     each, compiled to a hash-pinned `<tool>.txt` that every install uses
#     with --require-hashes (#787; requirements/README.md).
#     This reverses the original decision here — that there was no manifest
#     to watch, so ruff/gcovr stayed manual. "Manual" meant they were not
#     bumped at all, and commitizen (which computes the release version bump)
#     turned out never to have been pinned. One file both fixes that and makes
#     the pins visible here. Bump them like any other dependency, fixing any
#     new lint findings in the same PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
