name: Benchmarks

# Nightly (and on demand), when a change since the last measurement can move a
# number, re-run the scenario taxonomy across all baselines (AODV/OLSR/DSDV) and
# publish the refreshed results back into the repo: the cross-scenario summary
# in docs/benchmarks.md, the per-scenario pages in docs/benchmarks/scenarios/
# AND the taxonomy chart in docs/benchmarks/. So the published numbers + figures
# track the code within a day.
#
# Scope: this runs the *discrete* named scenarios at time=120 s but
# runs=10 -- the #293/#314 published-point floor. It used to be the --quick
# preset (runs=2), which was a cost choice from when Actions minutes were
# believed billed; #121's answer (they are not) removed the reason, and #318
# removed the excuse: at 2 runs the tables now render t(1)-wide intervals
# their own methodology calls unpublishable. The 120 s duration stays -- the
# floor is about dispersion, not duration, and absolute plausibility is the
# anchor gate's job. The heavier parameter sweeps (area/pause/scale) are
# manual campaigns (benchmark-cell.yml via tools/bench/campaign.py) at 900 s / 20 seeds.
#
# No `push` trigger (#864). It ran on every merge, and most of those runs were
# cancelled by the next merge (13 of 19 push runs from 10-30 to 11-08); the
# nightly run below already re-measures whenever something benchmark-relevant
# changed, so the push runs bought nothing but runner time. A daily run bounds
# how stale the published table can get at 24 h, whatever the merge cadence.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Read-only by default; each job that writes declares its own scopes
# below (Scorecard Token-Permissions, #785).
permissions:
  contents: read

# One benchmark at a time per event; a newer run supersedes an older one.
#
# The event name is part of the group on purpose: a manual dispatch must not
# cancel the nightly run, nor the reverse. (When this workflow also ran on
# every push, a single group let merge traffic starve the refresh: eight merges
# on 2026-07-26 each cancelled the run in flight and none produced a refresh
# commit, #224. Nothing failed; a cancelled run is not a failed run, which is
# why it went unnoticed.)
concurrency:
  group: benchmarks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The nightly run re-measures only when something that can move a number
  # changed since the commit the published table was measured at. Otherwise it
  # would re-measure identical code and only rewrite the `_Measured at <sha>_`
  # stamp -- 2-3 h of runner time a day for a docs-only commit (observed
  # 2026-09-07..09-23: every refresh commit was 7 stamp lines and no number).
  # This gate skips that case. It never skips a manual dispatch, and it runs
  # whenever the stamped commit lags a code change, so every benchmark-relevant
  # merge is re-measured within a day (#365, #864).
  changed:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The stamp update-benchmarks.py writes: .../commit/<40-hex sha>
          measured=$(grep -oE 'commit/[0-9a-f]{40}' docs/benchmarks.md | head -1 | cut -d/ -f2)
          if [ -z "$measured" ] || ! git cat-file -e "$measured^{commit}" 2>/dev/null; then
            echo "No usable measured-at stamp ('$measured'); running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Everything that can move a number: the protocol, the ns-3 module +
          # harness + tools, the image recipe, the build entry point, and this
          # workflow. (The ns-3 base image is only republished on merges, which
          # change these paths too.)
          if git diff --quiet "$measured" HEAD -- core ns3 docker Makefile .github/workflows/benchmarks.yml; then
            echo "Nothing benchmark-relevant changed since ${measured:0:7}; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Benchmark-relevant changes since ${measured:0:7}; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Read-only: the regenerated table + charts reach main through the publish
    # job's PR (#789); packages to pull the pre-built ns-3 image.
    permissions:
      contents: read
      packages: read
    # Build against the pre-built plain ns-3 image (same as ci.yml) instead of
    # compiling ns-3 from source, so the job has budget to run the whole
    # taxonomy instead of a single scenario.
    container:
      image: ghcr.io/danieljoppi/ns3:3.42
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Configure + build
        run: |
          cd /opt/ns-3
          ./ns3 configure --enable-examples \
            --enable-modules='anthocnet;aomdv;gpsr;oracle;adaptive;routing-bench;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point;mesh'
          ./ns3 build
      - name: Install matplotlib
        run: apt-get update && apt-get install -y python3-matplotlib
      - name: Validation-anchor gate (blocks publish; #59)
        # Run the known-expected anchors on the *stock* baselines harness
        # before producing or publishing any numbers: if an anchor regresses
        # (cf. the #51 ~50% single-hop loss that silently depressed every
        # published PDR ~2x) this step fails and the table/charts below are
        # never refreshed from a mis-calibrated channel. Thresholds live in
        # ns3/tools/anchors.yml; rationale in docs/benchmarks/methodology.md
        # "Validation anchors".
        run: |
          bash tools/checks/check-anchors.sh /opt/ns-3 single-hop
          bash tools/checks/check-anchors.sh /opt/ns-3 broch-low-mobility
      - name: Run scenario taxonomy (10 runs, 120 s — the #318 floor)
        run: |
          python3 ns3/tools/run-scenarios.py /opt/ns-3 \
            --out "$GITHUB_WORKSPACE/scenarios.csv" --only discrete \
            --runs 10 --time 120
      - name: Render charts
        run: python3 ns3/tools/make-charts.py "$GITHUB_WORKSPACE/scenarios.csv" --outdir docs/benchmarks
      - name: Update results tables (index summary + per-scenario pages)
        # --commit/--run-url (#365): every regenerated block states the commit
        # it was measured at. Two things this buys that the page banners alone
        # do not. (1) The banners claim these numbers "track the current tip of
        # main" -- true only while this job keeps up, and it demonstrably does
        # not: eight merges on 2026-07-26 produced no refresh at all because
        # each push cancelled the run in flight, and nothing on the page said
        # so. A stamped commit that lags main makes that staleness readable.
        # (2) A reader who wants to reproduce a cell now has the SHA to check
        # out, which is the acceptance criterion of #365.
        #
        # The cost is churn: because the stamp changes with every measured
        # commit, the commit step below fires on every run instead of only
        # when a number moves. That is the intended trade -- an unchanged table
        # measured at a new commit is new information, not an empty commit.
        run: |
          python3 ns3/tools/update-benchmarks.py "$GITHUB_WORKSPACE/scenarios.csv" \
            docs/benchmarks.md \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload CSV + charts artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            scenarios.csv
            scenarios-runs.csv
            docs/benchmarks/*.png
          retention-days: 7
      - name: Upload the regenerated pages (for the publish job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-pages
          path: |
            docs/benchmarks.md
            docs/benchmarks
          retention-days: 7

  # main takes no direct push (#789): the refreshed pages land through the PR
  # from bot/benchmarks (.github/actions/bot-pr), opened on a plain runner
  # because the ns-3 container has no gh. Until that PR merges, main's
  # measured-at stamp lags, so the nightly gate re-measures and the next run
  # replaces the PR's branch.
  publish:
    name: Open or update the benchmark PR
    needs: benchmark
    runs-on: ubuntu-24.04
    # contents + pull-requests: write only to open the PR with the workflow
    # token when no bot token is configured (#705).
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-pages
          path: docs
      - uses: ./.github/actions/bot-pr
        with:
          branch: bot/benchmarks
          title: 'chore(benchmarks): refresh benchmark results and charts'
          body: The scenario taxonomy re-measured at ${{ github.sha }} (10 runs, 120 s); `docs/benchmarks.md`, the per-scenario pages and the taxonomy chart regenerated by `ns3/tools/update-benchmarks.py` and `make-charts.py`.
          paths: docs/benchmarks.md docs/benchmarks
          labels: documentation,benchmark
          org-app-id: ${{ secrets.BOT_APP_ID }}
          org-app-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          app-key: ${{ secrets.AHN_BOT_APP_KEY }}
          token: ${{ secrets.ORG_BOT_TOKEN }}
