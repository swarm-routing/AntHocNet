name: Benchmarks

# Nightly (and on demand), when a change since the last measurement can move a
# number, re-run the scenario taxonomy across all baselines (AODV/OLSR/DSDV) and
# publish the refreshed results back into the repo: the cross-scenario summary
# in docs/benchmarks.md, the per-scenario pages in docs/benchmarks/scenarios/
# AND the taxonomy chart in docs/benchmarks/. So the published numbers + figures
# track the code within a day.
#
# Scope: this runs the *discrete* named scenarios at time=120 s and
# runs=20 (seeds 1-20, #977). Every protocol of a scenario runs on the same
# realisation per seed, so the table is paired by construction and meets org
# golden rule 6's ">= 20 seeds" floor for a comparison: a reader compares its
# columns, so it is held to the comparison floor, not to the 10-run
# publication floor (#293/#318) it used from #320 to #977, nor the 2-run
# --quick preset before that. The 120 s duration stays -- the floor is about
# dispersion, not duration, and absolute plausibility is the anchor gate's
# job. 20 seeds of the two heaviest scenarios do not fit one job ceiling
# (6 h) beside the other four, so each scenario is its own matrix job and
# the `tables` job joins them. The heavier parameter sweeps (area/pause/scale)
# are manual campaigns (benchmark-cell.yml via ns3-campaign) at 900 s / 20 seeds.
#
# No `push` trigger (#864). It ran on every merge, and most of those runs were
# cancelled by the next merge (13 of 19 push runs from 10-30 to 11-08); the
# nightly run below already re-measures whenever something benchmark-relevant
# changed, so the push runs bought nothing but runner time. A daily run bounds
# how stale the published table can get at 24 h, whatever the merge cadence.
#
# Paused from 2026-11-10 until #977 (#866, #867): the schedule was off
# until the control campaign #867 had measured the move to the campaign image
# (gcc-11 / ns-3.42 / default profile -> gcc-13 / ns-3.48 / release). Its
# cross-image rule was accepted on 2026-11-11 (docs/benchmarks/methodology.md
# "Cross-image rule"): a number from another ns-3 release is not compared with
# one from this image. So every generated block stamps the image digest and
# the ns-3 release it was measured on (update-benchmarks.py --image), and
# docs/benchmarks.md keeps the last ns-3 3.42 table as superseded, with no
# delta quoted against it.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Read-only by default; each job that writes declares its own scopes
# below (Scorecard Token-Permissions, #785).
permissions:
  contents: read

# One benchmark at a time per event; a newer run supersedes an older one.
#
# The event name is part of the group on purpose: a manual dispatch must not
# cancel the nightly run, nor the reverse. (When this workflow also ran on
# every push, a single group let merge traffic starve the refresh: eight merges
# on 2026-07-26 each cancelled the run in flight and none produced a refresh
# commit, #224. Nothing failed; a cancelled run is not a failed run, which is
# why it went unnoticed.)
concurrency:
  group: benchmarks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The nightly run re-measures only when something that can move a number
  # changed since the commit the published table was measured at. Otherwise it
  # would re-measure identical code and only rewrite the `_Measured at <sha>_`
  # stamp -- 2-3 h of runner time a day for a docs-only commit (observed
  # 2026-09-07..09-23: every refresh commit was 7 stamp lines and no number).
  # This gate skips that case. It never skips a manual dispatch, and it runs
  # whenever the stamped commit lags a code change, so every benchmark-relevant
  # merge is re-measured within a day (#365, #864).
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # a checkout and a git diff: seconds
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The stamp update-benchmarks.py writes: .../commit/<40-hex sha>
          measured=$(grep -oE 'commit/[0-9a-f]{40}' docs/benchmarks.md | head -1 | cut -d/ -f2)
          if [ -z "$measured" ] || ! git cat-file -e "$measured^{commit}" 2>/dev/null; then
            echo "No usable measured-at stamp ('$measured'); running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Everything that can move a number: the protocol, the ns-3 module +
          # harness + tools, the build entry point, the campaign image's recipe
          # and this workflow. (A new ns3-dev digest alone does not re-run the
          # table: the image of an unchanged commit is reused, skip-existing.)
          if git diff --quiet "$measured" HEAD -- core ns3 Makefile .github/workflows/benchmarks.yml .github/workflows/campaign-image.yml; then
            echo "Nothing benchmark-relevant changed since ${measured:0:7}; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Benchmark-relevant changes since ${measured:0:7}; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The table runs on the campaign image of this commit (#866): the modules
  # built once FROM a pinned ns3-dev:3.48-optimized digest (3.48 while the
  # ns-3.49 AODV livelock #843 is open; the taxonomy runs AODV), reused when
  # it already exists. The job builds nothing, and the numbers are measured in
  # ns-3's release profile, as every campaign's (bit-identical metrics, #124).
  # Moved from this repo's ns3:3.42 (gcc-11, default profile): before a table
  # measured here is compared with an older one, read the control campaign
  # #867.
  image:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/campaign-image.yml
    with:
      ns3-version: '3.48'

  # The validation anchors gate everything after them (#59): if an anchor
  # regresses (cf. the #51 ~50% single-hop loss that silently depressed every
  # published PDR ~2x), no scenario runs and the table is never refreshed from
  # a mis-calibrated channel. Thresholds live in ns3/tools/anchors.yml;
  # rationale in docs/benchmarks/methodology.md "Validation anchors".
  anchors:
    needs: [changed, image]
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # ~2 min on the campaign image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner (it needs sudo on the VM).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The campaign image (built, release profile)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          echo "image: $IMAGE"
          cat /opt/ns-3/.swarm-configure.env
          cd /opt/ns-3 && ./ns3 show profile
      - name: Validation-anchor gate (blocks publish; #59)
        run: |
          bash tools/checks/check-anchors.sh /opt/ns-3 single-hop
          bash tools/checks/check-anchors.sh /opt/ns-3 broch-low-mobility

  # One job per discrete scenario (DISCRETE in ns3/tools/run-scenarios.py), so
  # 20 seeds of the heaviest one stay far under the job ceiling. The list is
  # the table's row order.
  benchmark:
    needs: [image, anchors]
    runs-on: ubuntu-24.04
    timeout-minutes: 180  # the heaviest scenario, 20 seeds: ~75 min (#977)
    strategy:
      fail-fast: true
      matrix:
        scenario: [dense-small, paper-base, sparse-static, high-mobility, heavy-load, large-scale]
    # Read-only: the regenerated table + charts reach main through the publish
    # job's PR (#789); packages to pull the campaign image.
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ${{ matrix.scenario }} (20 seeds, 120 s; #977)
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 ns3/tools/run-scenarios.py /opt/ns-3 \
            --out "$GITHUB_WORKSPACE/scenarios-$SCENARIO.csv" --only "$SCENARIO" \
            --runs 20 --time 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-${{ matrix.scenario }}
          path: |
            scenarios-${{ matrix.scenario }}.csv
            scenarios-${{ matrix.scenario }}-runs.csv
          retention-days: 7

  tables:
    needs: [image, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scenario-*
          path: parts
          merge-multiple: true
      - name: Join the scenario CSVs in the table's row order
        run: |
          python3 - <<'EOF'
          import csv
          order = ["dense-small", "paper-base", "sparse-static",
                   "high-mobility", "heavy-load", "large-scale"]
          for suffix in ("", "-runs"):
              rows, head = [], None
              for name in order:
                  with open(f"parts/scenarios-{name}{suffix}.csv", newline="") as f:
                      r = csv.DictReader(f)
                      head = head or r.fieldnames
                      rows += list(r)
              with open(f"scenarios{suffix}.csv", "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=head)
                  w.writeheader()
                  w.writerows(rows)
              print(f"scenarios{suffix}.csv: {len(rows)} rows")
          EOF
      - name: Install matplotlib
        timeout-minutes: 3  # apt; longest green run: 34 s (#840)
        run: |
          for i in 1 2 3; do
            apt-get update -qq --error-on=any && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
          apt-get install -y python3-matplotlib
      - name: Render charts
        run: python3 ns3/tools/make-charts.py scenarios.csv --outdir docs/benchmarks
      - name: Update results tables (index summary + per-scenario pages)
        # --commit/--run-url (#365): every regenerated block states the commit
        # it was measured at, so a stamped commit that lags main makes
        # staleness readable and a reader has the SHA to reproduce a cell.
        # --image/--ns3-release (#977): and the image digest and ns-3 release,
        # because under the cross-image rule numbers from different ns-3
        # releases are not compared, and the block is what a reader quotes.
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          . /opt/ns-3/.swarm-configure.env
          python3 ns3/tools/update-benchmarks.py scenarios.csv \
            docs/benchmarks.md \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --image "$IMAGE" --ns3-release "$NS3_VERSION"
      - name: Upload CSV + charts artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            scenarios.csv
            scenarios-runs.csv
            docs/benchmarks/*.png
          retention-days: 7
      - name: Upload the regenerated pages (for the publish job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-pages
          path: |
            docs/benchmarks.md
            docs/benchmarks
          retention-days: 7

  # main takes no direct push (#789): the refreshed pages land through the PR
  # from bot/benchmarks (.github/actions/bot-pr), opened on a plain runner
  # because the ns-3 container has no gh. Until that PR merges, main's
  # measured-at stamp lags, so the nightly gate re-measures and the next run
  # replaces the PR's branch.
  publish:
    name: Open or update the benchmark PR
    needs: tables
    runs-on: ubuntu-24.04
    # contents + pull-requests: write only to open the PR with the workflow
    # token when no bot token is configured (#705).
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-pages
          path: docs
      - uses: ./.github/actions/bot-pr
        with:
          branch: bot/benchmarks
          title: 'chore(benchmarks): refresh benchmark results and charts'
          body: The scenario taxonomy re-measured at ${{ github.sha }} (20 seeds, 120 s); `docs/benchmarks.md`, the per-scenario pages and the taxonomy chart regenerated by `ns3/tools/update-benchmarks.py` and `make-charts.py`.
          paths: docs/benchmarks.md docs/benchmarks
          labels: documentation,benchmark
          org-app-id: ${{ secrets.BOT_APP_ID }}
          org-app-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          app-key: ${{ secrets.AHN_BOT_APP_KEY }}
          token: ${{ secrets.ORG_BOT_TOKEN }}
