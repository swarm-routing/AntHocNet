name: CI / core

# The simulator-free core: unit tests, sanitizers, coverage, codec fuzzing.
# swarm-core comes from its vcpkg port (swarm-routing/.github#489) in the
# unit-test and sanitizer jobs, so CI builds against what the registry
# publishes; the coverage and fuzz jobs compile the same release's sources
# (tools/swarm_core.py path, the tarball swarm-core.lock names) with their
# own instrumentation, as before.
# Called by ci.yml (#610: ci.yml split by area behind the one CI gate, #607);
# not triggered on its own. Same jobs, same checks as before the split.
on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  core:
    name: core library + unit tests
    runs-on: ubuntu-24.04
    # Job and apt-step timeouts (#840): an apt-get hang held these jobs for
    # 35-45 min (2026-10-31); the jobs take 1-4 min when green.
    timeout-minutes: 15  # longest green run: 2.2 min
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        timeout-minutes: 10  # apt; longest green run: 3.1 min (#840)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq --error-on=any && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
          sudo apt-get install -y cmake g++
      - name: vcpkg (swarm-routing/.github#489)
        id: vcpkg
        uses: swarm-routing/.github/.github/actions/setup-vcpkg@7726eae582ef488170ba81f96b1aeb2819ebc029 # main@2026-11-22
        timeout-minutes: 8
        with:
          # The NuGet cache needs mono on the runner (28-50 s to install); the
          # three ports it would restore build in about 5 s, so here it costs
          # more than it saves (measured on swarm-routing/ARA#176; the
          # maintainer's decision on swarm-routing/.github#489).
          binary-cache: 'off'
      - name: Build and test core (swarm-core from its vcpkg port)
        # setup-vcpkg exports VCPKG_ROOT; the Makefile then configures with
        # vcpkg's toolchain, in core/build-vcpkg (its vcpkg_installed is reused below)
        run: make test
      - name: The CMake package anthocnet-core (find_package, on the swarm-core port; #1037)
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          prefix="$PWD/core/build-pkg/prefix"
          installed="$PWD/core/build-vcpkg/vcpkg_installed"
          cmake -S core -B core/build-pkg/core -DANTHOCNET_CORE_INSTALL=ON -DANTHOCNET_CORE_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$installed"
          cmake --build core/build-pkg/core -j && cmake --install core/build-pkg/core --prefix "$prefix"
          for f in lib/libanthocnet_core.a include/anthocnet/core/ant_message_codec.h lib/cmake/anthocnet-core/anthocnet-coreConfig.cmake lib/cmake/anthocnet-core/anthocnet-coreConfigVersion.cmake; do
            test -f "$prefix/$f" || { echo "::error::the install has no $f"; exit 1; }
          done
          cmake -S core/tests/consumer-package -B core/build-pkg/consumer -DCMAKE_PREFIX_PATH="$prefix;$installed/x64-linux"
          cmake --build core/build-pkg/consumer && core/build-pkg/consumer/consumer
      - name: No primitive defined both here and in swarm-core (gate)
        # swarm-routing/ns3-swarm-core#14 (S9): slices S2-S8 emptied the list;
        # it stays empty. The counterparts are checked against the sources of
        # swarm-core's release (swarm-core.lock; tools/swarm_core.py unpacks it).
        run: |
          python3 -I tools/checks/check-swarm-core-dupes.py --self-test
          # its own assignment, so a failed download stops the step (an empty
          # --swarm-core would skip every counterpart check)
          swarm_core=$(python3 -I tools/swarm_core.py path)
          python3 -I tools/checks/check-swarm-core-dupes.py --gate --swarm-core "$swarm_core"
  core-sanitizers:
    name: core under ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # longest green run: 3.6 min (#840)
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        timeout-minutes: 10  # apt; longest green run: 3.1 min (#840)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq --error-on=any && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
          sudo apt-get install -y cmake g++
      - name: vcpkg (swarm-routing/.github#489)
        id: vcpkg
        uses: swarm-routing/.github/.github/actions/setup-vcpkg@7726eae582ef488170ba81f96b1aeb2819ebc029 # main@2026-11-22
        timeout-minutes: 8
        with:
          # The NuGet cache needs mono on the runner (28-50 s to install); the
          # three ports it would restore build in about 5 s, so here it costs
          # more than it saves (measured on swarm-routing/ARA#176; the
          # maintainer's decision on swarm-routing/.github#489).
          binary-cache: 'off'
      - name: Build core with sanitizers and run tests (AntHocNet instrumented, swarm-core the port as published)
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B core/build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"
          cmake --build core/build-san -j
          cd core/build-san && ctest --output-on-failure
  core-coverage:
    name: core test coverage (gcov, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # longest green run: 2.5 min (#840)
    # Which parts of core/ do the 18 ctest targets actually execute? The repo's
    # expensive failures (D2 evaporation, the #19 detector-D storm, the 8-bit
    # sequence wrap) were all behaviour in paths nothing exercised, so make that
    # answerable instead of intuited — and use it to aim new tests.
    #
    # Report-only on purpose (#162): there is deliberately **no --fail-under**
    # threshold here. Coverage is a map of untested paths, not a target; a floor
    # chosen before a baseline exists is either meaningless or an obstacle that
    # gets disabled the first time it bites. Observe the number across a few
    # merges, then pick a floor from evidence in a follow-up.
    #
    # No container/simulator: core/ builds standalone in seconds (golden rule 1).
    # Adapter coverage would mean instrumenting a containerized ns-3 build and is
    # out of scope.
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install pinned gcovr
        uses: ./.github/actions/python-tools
        with:
          packages: gcovr
      - name: Install toolchain
        timeout-minutes: 10  # apt; longest green run: 1.9 min (#840)
        # gcovr is pinned so the reported baseline stays comparable across
        # merges — its per-version gcov parsing shifts the numbers. The pin
        # lives in requirements/ (hash-pinned, #787) so Dependabot can see it;
        # bump it there, noting the step change in the PR.
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq --error-on=any && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
          sudo apt-get install -y cmake g++
      - name: Build core with gcov instrumentation
        run: |
          cmake -S core -B core/build-coverage -DCMAKE_BUILD_TYPE=Debug \
            -DANTHOCNET_COVERAGE=ON -DSWARM_CORE_DIR="$(python3 -I tools/swarm_core.py path)"
          cmake --build core/build-coverage -j
      - name: Run the unit tests (emits the .gcda counters)
        run: cd core/build-coverage && ctest --output-on-failure
      - name: Report coverage of core/src + core/include
        # --exclude drops core/tests/ so the number measures coverage *of* the
        # core, not of the tests (which are ~100% by construction and would
        # dilute it). --txt gives the per-file table, --print-summary the overall
        # line/function/branch totals; both land in the job log, and the drill-
        # down HTML + Cobertura XML go to the artifact below.
        run: |
          mkdir -p coverage
          gcovr --root . core/build-coverage \
            --filter 'core/src/' --filter 'core/include/' \
            --exclude 'core/tests/' \
            --txt --print-summary \
            --html-details coverage/index.html \
            --xml-pretty --xml coverage/coverage.xml \
            --json-summary coverage/summary.json
      - name: Upload the detailed report (HTML + Cobertura XML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-coverage-report
          path: coverage/
          retention-days: 14
      # The README badge's number is published by swarm-routing.github.io's
      # pages.yml (#333, #850), which recomputes it with this job's build,
      # filters and gcovr pin, on the core pinned in its protocols.lock.
  codec-fuzz:
    name: codec fuzz (libFuzzer, 60s)
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # longest green run: 1.6 min; the backstop if -max_total_time is ever dropped (#982)
    # The codec is the only parser of untrusted network bytes (item 12), so fuzz
    # its decode path against a small seed corpus. ubuntu-24.04's clang ships
    # the libFuzzer/ASan runtimes; a crash/UB/over-read fails the job.
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the codec fuzz target (clang + libFuzzer/ASan)
        run: |
          cmake -S core -B core/build-fuzz -DANTHOCNET_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++ \
            -DSWARM_CORE_DIR="$(python3 -I tools/swarm_core.py path)"
          cmake --build core/build-fuzz --target fuzz_codec
      - name: Fuzz the decode path for 60s
        run: |
          core/build-fuzz/tests/fuzz_codec -max_total_time=60 -print_final_stats=1 \
            core/tests/fuzz_corpus
