name: swarm-core pin

# core/ builds on swarm-core's core/ at the release swarm-core.lock names
# (swarm-routing/ns3-swarm-core#134, #14). This check (swarm-routing/.github
# reusable-swarm-core-pin.yml, lock mode) fails unless the lock verifies
# against the release, core/CMakeLists.txt reads it, and the Makefile and every
# workflow's swarm-core core-deps (licence.yml) name the same release, and
# when a newer swarm-core release is out: org-bot then opens the bump PR. The
# check is named `swarm-core / pin`;
# it is report-only here (not in the ruleset's required checks).
on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  swarm-core:
    uses: swarm-routing/.github/.github/workflows/reusable-swarm-core-pin.yml@10d9057fc3bcd21f39be701885929db4c056e6f8 # main@2026-11-25
