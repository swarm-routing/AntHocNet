name: CodeQL

# Static analysis of the C++ the repo owns outside ns-3 (#619): core/. (The
# browser adapter moved to swarm-routing/swarm-routing.github.io, #850.) The
# fuzzer and the sanitizers find what executes; this finds what does not,
# which matters here because ADR-0020 keeps a lot of mechanism code behind
# default-off switches that no smoke run reaches. Results go to the Security
# tab. The ns-3 module is not analysed: it needs a full ns-3 build in the
# container, and the code it adds over core/ is the thin adapter.
#
# Every pull request is analysed, docs-only ones included (#786). Scorecard's
# SAST check counts merged PRs whose head commit carries a SAST check run, so
# a path filter here would lower the ratio. The cost is one ~3 min job running
# in parallel with ci.yml, which takes longer, so a PR's wall-clock time does
# not change. The push and schedule runs stay: they keep main's results in the
# Security tab.
#
# Report-only: CodeQL is not one of the CI gate's needs (ci.yml). A finding
# shows as a code-scanning alert on the PR and in the Security tab. Whether
# alerts should block a merge belongs to the branch ruleset (#789), not to
# this workflow.
on:
  pull_request:
    branches: [main]
  # The main ruleset's code_scanning rule also judges merge groups: with the
  # merge queue on, a group needs its own CodeQL results (GitHub's
  # code-scanning docs ask for this trigger when a merge queue is configured).
  merge_group:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/codeql.yml'
      - 'tools/checks/filter-codeql-sarif.py'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running analysis; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build core
        run: |
          # swarm-core's sources at the release swarm-core.lock names (tools/swarm_core.py),
          # analysed with the core as before the vcpkg switch (swarm-routing/.github#489)
          cmake -S core -B build-codeql/core -DCMAKE_BUILD_TYPE=Release \
            -DSWARM_CORE_DIR="$(python3 -I tools/swarm_core.py path)"
          cmake --build build-codeql/core -j
      # Analyse without uploading, drop the reviewed results, then upload.
      # CodeQL's query-filters cannot be path-scoped, so a config file would
      # hide cpp/equality-on-floats and cpp/unused-static-function in
      # core/src/ too, and paths-ignore on core/tests/ would hide every rule
      # there. tools/checks/filter-codeql-sarif.py drops exactly those two
      # rules under core/tests/ (maintainer decision 2026-11-22; the evidence
      # and rationale are in its docstring, on the `security` tickets and on
      # swarm-routing/.github#629). Both steps are first-party.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp
          upload: never
          output: sarif-results
      - name: Drop the reviewed core/tests/ results
        run: |
          python3 -I tools/checks/filter-codeql-sarif.py --self-test
          python3 -I tools/checks/filter-codeql-sarif.py sarif-results/*.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif-results
          category: /language:c-cpp
