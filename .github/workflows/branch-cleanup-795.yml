name: branch-cleanup-795

# ONE-OFF, manually dispatched: the maintainer-approved branch cleanup of #795
# (https://github.com/swarm-routing/AntHocNet/issues/795, approved list:
# https://github.com/swarm-routing/AntHocNet/issues/795#issuecomment-6855717327).
# It exists because the agent sessions' proxy refuses branch deletion through
# the API, so the maintainer starts it from the GitHub app (Actions -> Run
# workflow). It does two things and nothing else:
#   1. creates the six `experiment/arm-*` tags at the listed SHAs, so those
#      experiments stay reachable after their branches go;
#   2. deletes exactly the 159 listed branches (the 151 listed on #795, the six
#      claude/arm-* branches now kept as tags, the post-#459 handoff branch and
#      the #793 proof branch).
# `main`, `ns3-module` and `bench/459-ab-pre` (#460 names it) are kept, and a
# guard aborts the run if any of them is ever in the list.
# Run it with dry_run on first (prints only), then with dry_run off. A
# follow-up PR removes this file once it has run.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type delete-159 to confirm'
        required: true
        type: string
      dry_run:
        description: 'Only print what would happen (tags and deletions)'
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: branch-cleanup-795
  cancel-in-progress: false

jobs:
  cleanup:
    name: tag the arm experiments, delete the listed branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # ~165 REST calls, seconds each at most
    permissions:
      contents: write  # create tags, delete branches (GITHUB_TOKEN)
    env:
      GH_TOKEN: ${{ github.token }}
      R: repos/${{ github.repository }}
      CONFIRM: ${{ inputs.confirm }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # The org's mandatory first step (swarm-routing/.github CONTRIBUTING,
      # CI hygiene); audit only, it changes nothing the job does.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - name: Write the approved lists, check the confirmation and the guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "delete-159" ]; then
            echo "::error::confirm must be exactly delete-159 (got '$CONFIRM'); nothing done"
            exit 1
          fi
          # name <TAB> sha: kept as refs/tags/experiment/<name>
          cat > "$RUNNER_TEMP/tags.tsv" <<'EOF'
          arm-a-thesis-single-route	32f96838e5843a588b5d06791c023ee140d812d5
          arm-b-source-band	1416a36182bef4b8512d61ce099e52c1697ef47c
          arm-beta20	2cda136d656260d1dd70163424deb7b8e74d2543
          arm-beta20-on-b	31bb0387d32e631e7ef9e20243ddf3029a2a815b
          arm-macmetric	6dd557cc0f7667ead2d20811dbcc0ba833aca5e6
          arm-thesis-combined	64cb9a740d4727a68b03097261ea9dd1e4cbc2bc
          EOF
          cat > "$RUNNER_TEMP/branches.txt" <<'EOF'
          bench/431-remeasure
          bench/432-irregular-cell
          bench/432-sat-adversarial
          bench/432-seam-results
          bench/444-sat-preflight
          bench/replay-fanet-39046294632
          bench/replay-fanet-39146771298
          bench/replay-isl-39046297399
          bench/replay-isl-39147743243
          bench/replay-leo-39087314414
          bench/replay-leo-39146776603
          bench/replay-manet-39046291415
          bench/replay-manet-39146767150
          bench/replay-mesh-39046293217
          bench/replay-mesh-39146769122
          bench/replay-vanet-39087312796
          claude/123-opt-image
          claude/125-matrix-fix
          claude/143-linkmetric-registry
          claude/154-testbench
          claude/158-park-dockerhub
          claude/162-coverage
          claude/88-thop
          claude/abc-year
          claude/acceptance-factor-provenance
          claude/adapter-sanitizers-130
          claude/adopt-source-band
          claude/ai-files-opus
          claude/ai-pr-review-811
          claude/anthocnet-project-review-2brrrv
          claude/anthocnet-review-rename
          claude/antohocnet-2026-roadmap-u7j8ff
          claude/antohocnet-roadmap-v1-3-v1-4-rnaah5
          claude/ara-citation
          claude/bench-caveats
          claude/bench-parse-blocks
          claude/benchmarks-restructure
          claude/bot-pr-org-app
          claude/bot-prs
          claude/byte-nrl-132
          claude/campaign-benchmark-cell
          claude/campaign-v2.4.0
          claude/campaign-v240-results
          claude/caveat-stop-citing-numbers
          claude/ci-align
          claude/ci-codeql-on-prs-786
          claude/ci-prebuilt-images
          claude/ci-token-permissions-785
          claude/codeql-action-4.39.1
          claude/config-provenance-sweep
          claude/configuration-guide
          claude/context-config-pointer
          claude/context-stale-issue-state
          claude/control-pre-224
          claude/cutover-site
          claude/dead-run-links
          claude/dependabot-pr-review-omqv4l
          claude/determinism-gate-129
          claude/disaster-580
          claude/disaster-plan-fix
          claude/disaster-results
          claude/docker-pin-787
          claude/docs-improvements-review-2nteux
          claude/doi
          claude/drop-cause-breakdown
          claude/energy-metrics
          claude/epics-refresh-20261110
          claude/evap-static-decay
          claude/export-ignore-ci-config
