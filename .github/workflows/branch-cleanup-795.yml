          claude/arm-a-thesis-single-route
          claude/arm-b-source-band
          claude/arm-beta20
          claude/arm-beta20-on-b
          claude/arm-macmetric
          claude/arm-thesis-combined
          claude/antohocnet-post-459-handoff-qm2rm2
          claude/throwaway-793-broken-default
          EOF
          # The heredocs are indented for YAML; strip the indentation.
          sed -i 's/^ *//' "$RUNNER_TEMP/tags.tsv" "$RUNNER_TEMP/branches.txt"
          n=$(grep -c . "$RUNNER_TEMP/branches.txt")
          if [ "$n" -ne 159 ]; then
            echo "::error::the branch list has $n entries, expected 159; nothing done"
            exit 1
          fi
          if [ "$(sort "$RUNNER_TEMP/branches.txt" | uniq -d | wc -l)" -ne 0 ]; then
            echo "::error::the branch list has duplicates; nothing done"
            exit 1
          fi
          for keep in main ns3-module bench/459-ab-pre; do
            if grep -qxF "$keep" "$RUNNER_TEMP/branches.txt"; then
              echo "::error::guard: kept branch '$keep' is in the delete list; aborting, nothing done"
              exit 1
            fi
          done
          echo "confirm ok; 159 branches listed; guard ok; dry_run=$DRY_RUN"

      - name: Create the experiment/arm-* tags
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name sha; do
            ref="tags/experiment/$name"
            if cur=$(gh api "$R/git/ref/$ref" --jq .object.sha 2>/dev/null); then
              if [ "$cur" = "$sha" ]; then
                echo "exists experiment/$name at $sha (skipped)"
                continue
              fi
              echo "::error::experiment/$name exists at $cur, not $sha"
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "would tag experiment/$name at $sha"
            else
              gh api -X POST "$R/git/refs" -f "ref=refs/$ref" -f "sha=$sha" >/dev/null
              echo "tagged experiment/$name at $sha"
            fi
          done < "$RUNNER_TEMP/tags.tsv"

      - name: Delete the listed branches
        shell: bash
        run: |
          set -euo pipefail
          deleted=0 gone=0 failed=0
          while read -r b; do
            # Does the branch exist? (404: already gone)
            if ! head=$(gh api "$R/git/ref/heads/$b" --jq .object.sha 2>"$RUNNER_TEMP/err"); then
              if grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
                echo "already gone $b"; gone=$((gone + 1))
              else
                echo "::error::FAILED $b (lookup): $(cat "$RUNNER_TEMP/err")"; failed=$((failed + 1))
              fi
              continue
            fi
            # A claude/arm-* branch goes only once its tag exists at the branch's head.
            case "$b" in
              claude/arm-*)
                name=${b#claude/}
                want=$(awk -F'\t' -v n="$name" '$1 == n { print $2 }' "$RUNNER_TEMP/tags.tsv")
                tag=$(gh api "$R/git/ref/tags/experiment/$name" --jq .object.sha 2>/dev/null || true)
                if [ "$DRY_RUN" = "true" ] && [ -z "$tag" ]; then
                  tag=$want  # the tag step would have created it
                fi
                if [ -z "$tag" ] || [ "$tag" != "$want" ] || [ "$head" != "$want" ]; then
                  echo "::error::FAILED $b: tag experiment/$name='${tag:-missing}', branch head $head, expected $want; not deleted"
                  failed=$((failed + 1)); continue
                fi
                ;;
            esac
            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete $b ($head)"; deleted=$((deleted + 1))
            elif gh api -X DELETE "$R/git/refs/heads/$b" >/dev/null 2>"$RUNNER_TEMP/err"; then
              echo "deleted $b ($head)"; deleted=$((deleted + 1))
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/err" ||
              { grep -q 'HTTP 422' "$RUNNER_TEMP/err" &&
                ! gh api "$R/git/ref/heads/$b" >/dev/null 2>"$RUNNER_TEMP/err2" &&
                grep -q 'HTTP 404' "$RUNNER_TEMP/err2"; }; then
              # 422 counts as gone only when a fresh lookup confirms the branch is absent
              echo "already gone $b"; gone=$((gone + 1))
            else
              echo "::error::FAILED $b: $(cat "$RUNNER_TEMP/err")"; failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/branches.txt"
          verb=deleted; [ "$DRY_RUN" = "true" ] && verb="would delete"
          {
            echo "## Branch cleanup (#795)$([ "$DRY_RUN" = "true" ] && echo ' — dry run')"
            echo ""
            echo "| result | count |"
            echo "|---|---|"
            echo "| $verb | $deleted |"
            echo "| already gone | $gone |"
            echo "| failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$verb=$deleted already-gone=$gone failed=$failed"
          [ "$failed" -eq 0 ]
