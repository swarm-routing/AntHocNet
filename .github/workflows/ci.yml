name: CI

on:
  # Limit push to the default branch so PR branches run once (via the
  # pull_request event) instead of twice (push + pull_request). Both main and
  # master are listed so this works before/after the default-branch rename.
  push:
    branches: [main, master]
  pull_request:
  # The merge queue (main ruleset `merge_queue`, .github/org-sync.toml) waits
  # for `CI gate` on each merge group; without this trigger it never comes.
  merge_group:
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases to build and test, e.g. ["3.36","3.42"] (empty = the release ns-3 supports)'
        required: false
        default: ''
      ns3-gate-version:
        description: 'On demand: the ns-3 version that also runs the gates (empty = 3.48 while ns-3.49 AODV is broken, #843)'
        required: false
        default: ''

# A force-push to a PR branch obsoletes the in-flight run — cancel it instead
# of paying for the full matrix twice. Main-branch runs are never cancelled
# (cancel-in-progress is false there): every merge keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# packages:read lets the container jobs pull the pre-built simulator images
# from GHCR; contents:read is for checkout.
permissions:
  contents: read
  packages: read

jobs:
  # Docs-only PRs skip the heavy jobs (#607). Pushes to main and manual runs
  # always run everything; a merge group is filtered like a PR, against the
  # queue's base (a merge group has no pull_request.base.sha). A PR is "docs-only" when every changed file is
  # prose, docs, the paper, an issue template, committed benchmark data
  # (results/, scenarios.csv: benchmark-cell's own data PRs), the agent files
  # (.claude/: procedures, never shipped, golden rule 10) or repo metadata no
  # gated job reads (LICENSE-MIT, .lycheeignore, .coderabbit.yaml, CODEOWNERS,
  # FUNDING.yml, dependabot.yml) (#864). The single `CI gate` job at
  # the end is the one check to require: it passes when every job it waits on
  # passed or was skipped, so skipped jobs never block a merge.
  changes:
    name: what changed (docs-only PRs skip the heavy jobs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # longest green run: 0.4 min (#982)
    outputs:
      code: ${{ steps.diff.outputs.code }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then printf 'code=true\nsite=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf 'changed:\n%s\n' "$files"
          code=false
          if [ -z "$files" ] || printf '%s\n' "$files" \
              | grep -qvE '^(docs/|paper/|results/|\.claude/|\.github/ISSUE_TEMPLATE/)|\.md$|^mkdocs\.yml$|^LICENSE(-MIT)?$|^CITATION\.cff$|^scenarios\.csv$|^\.(lycheeignore|coderabbit\.yaml)$|^\.github/(CODEOWNERS|FUNDING\.yml|dependabot\.yml)$'; then
            code=true
          fi
          # The published site is built in swarm-routing/swarm-routing.github.io
          # from this repo at a pinned commit (#850). The pages job (ci-web.yml)
          # checks this repo's docs and API under that site's shell, with the
          # game on this core: the docs (mkdocs, its hooks render CHANGELOG.md),
          # the API (Doxygen over api/, core/ headers, the ns-3 entry headers,
          # VERSION), the core compiled to WASM (a protocol change must still
          # deliver in every world), the ns-3 replay traces the game plays
          # (results/replay/), the scripts and actions the job runs, and the two
          # workflows that define it. A docs-only PR still gets the page tests.
          site=false
          if printf '%s\n' "$files" | grep -qE '^(docs/|api/|core/|ns3/anthocnet/helper/|ns3/anthocnet/model/anthocnet-(routing-protocol|adapters|packet)\.h$|results/replay/|requirements/mkdocs-material\.(in|txt)$|tools/checks/(fetch-site-web\.sh|check-site\.py)$|mkdocs\.yml$|CHANGELOG\.md$|VERSION$|\.github/workflows/(ci|ci-web)\.yml$|\.github/actions/(setup-emsdk|python-tools)/)'; then
            site=true
          fi
          echo "code=$code site=$site"
          printf 'code=%s\nsite=%s\n' "$code" "$site" >> "$GITHUB_OUTPUT"

  allowlists:
    name: module/arm/marker allowlist consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # longest green run: 0.4 min (#982)
    # #435: the module lists (ci-ns3.yml's mods=, benchmark-cell.yml's
    # --enable-modules, the retired Dockerfile.ns3) and the protocol-arm awk alternation
    # (check-determinism.sh filter_rows) are hand-maintained copies that fail
    # SILENTLY when one is missed — four of the ten were, in one day, the
    # last of which broke every v1.5.0 ns-3 release image. Pure text against
    # tree-derived ground truth: seconds, no ns-3 build.
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check allowlists against the tree
        run: bash tools/checks/check-allowlists.sh

  # The three areas (#610), each a reusable workflow. A call job's result is
  # its jobs' combined result, so the gate below still sees every check.
  core:
    name: core
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-core.yml

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/ci-web.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      site: ${{ needs.changes.outputs.site }}

  ns3:
    name: ns3
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-ns3.yml
    # Automatic runs: the ns-3 release ns-3 supports (ns3-dev:latest). Older
    # releases only through the manual inputs above (org CONTRIBUTING
    # invariant 7).
    # TEMPORARY EXCEPTION (#843, swarm-routing/ns3-containers#35, option A):
    # ns-3.49's stock AODV, and the vendored AOMDV, livelock in a zero-time ICMP
    # storm. Nearly every gate, the package checks and the kits run an
    # AODV-family arm, so the gate leg runs on ns3-dev:3.48 until the first
    # ns-3 release with the fix reaches `latest`; then set this back to
    # 'latest'. The `latest` leg still builds, runs the unit tests, the example
    # and the AntHocNet-only smokes on 3.49. No gate floor changes.
    with:
      versions: ${{ inputs.ns3-versions || '["latest"]' }}
      gate-version: ${{ inputs.ns3-gate-version || '3.48' }}


  # The one check to require in branch protection (#607): passes when every
  # job above passed or was skipped (docs-only PRs), fails on any failure or
  # cancellation.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5  # longest green run: 0.3 min; a hung gate stalls the merge queue (#982)
    if: always()
    needs: [changes, allowlists, core, web, ns3]
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in sorted(needs.items()):
              print("%9s  %s" % (v["result"], k))
          sys.exit(f"CI gate: {bad}" if bad else 0)
          '
