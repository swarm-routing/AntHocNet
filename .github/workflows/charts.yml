name: Charts

# Keeps every chart drawn from *committed* data in step with that data:
# the family results charts (docs/benchmarks/charts/) and the sweep charts
# (docs/benchmarks/sweep-*.png), all rendered by ns3/tools/family-charts.py
# from results/cells/ and results/campaign/.
#
# Before this workflow those charts were rendered by hand, so a re-measured
# cell or a restyled chart script left the published figure stale until
# someone remembered. The per-merge taxonomy chart (discrete-summary.png) is
# not this workflow's: it is measured, not committed, and benchmarks.yml
# renders it from the run it just made.
#
# On main: re-render and, when a PNG actually changed (rendering is
# deterministic, so an unchanged input is no change), open or update the PR
# from bot/charts (.github/actions/bot-pr; main takes no direct push, #789).
# On a PR:
# render as a check, so a broken chart script or an unparsable cell fails
# before merge, and upload the PNGs for the reviewer.
#
# Re-measuring a sweep: rescue its CSV into results/campaign/, cite it
# on the sweep page, and point SWEEP_SOURCES in family-charts.py at it; the
# next run here re-renders the sweep PNGs from the cited CSVs, which is what
# the pages say they show.
on:
  push:
    branches: [main]
    paths:
      - 'results/cells/**'
      - 'results/campaign/**'
      - 'ns3/tools/family-charts.py'
      - 'ns3/tools/make-charts.py'
      - 'tools/bench/bench_parse.py'
      - 'tools/bench/stats_util.py'
      - 'requirements/matplotlib.txt'
      - '.github/workflows/charts.yml'
  pull_request:
    paths:
      - 'results/cells/**'
      - 'results/campaign/**'
      - 'ns3/tools/family-charts.py'
      - 'ns3/tools/make-charts.py'
      - 'tools/bench/bench_parse.py'
      - 'tools/bench/stats_util.py'
      - 'requirements/matplotlib.txt'
      - '.github/workflows/charts.yml'
  workflow_dispatch:

# Read-only by default; each job that writes declares its own scopes
# below (Scorecard Token-Permissions, #785).
permissions:
  contents: read

# Pushes queue rather than cancel: each run renders the tree it checked out,
# so a cancelled run could leave main's charts one change behind.
concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Render charts from committed data
    runs-on: ubuntu-24.04
    # contents + pull-requests: write only to open the chart PR with the
    # workflow token when no bot token is configured (#789, #705).
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install matplotlib
        # Pinned in requirements/: a matplotlib release changes the
        # rendered pixels, so a float here would recommit every PNG.
        uses: ./.github/actions/python-tools
        with:
          packages: matplotlib
      - name: Render
        run: python3 ns3/tools/family-charts.py
      - name: Show what changed
        run: git status --short docs/benchmarks
      - name: Upload charts (PR review)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charts
          path: |
            docs/benchmarks/charts/*.png
            docs/benchmarks/sweep-*.png
          retention-days: 7
      - name: Open or update the chart PR (main only, if changed)
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/bot-pr
        with:
          branch: bot/charts
          title: 'chore(charts): re-render charts from committed data'
          body: Charts re-rendered by `ns3/tools/family-charts.py` from the committed data in `results/cells/` and `results/campaign/` at ${{ github.sha }}.
          paths: docs/benchmarks/charts docs/benchmarks/sweep-*.png
          labels: documentation,benchmark
          org-app-id: ${{ secrets.BOT_APP_ID }}
          org-app-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          app-key: ${{ secrets.AHN_BOT_APP_KEY }}
          token: ${{ secrets.ORG_BOT_TOKEN }}
