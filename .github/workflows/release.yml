name: Release

# Commitizen-driven release in two steps, because main takes no direct push
# (a ruleset: PR required, `CI gate` required, no bypass actors; #789, #882).
#
# 1. Dispatch mode=bump. Commitizen computes the next SemVer from the
#    Conventional-Commit history since the last tag (feat -> minor, fix ->
#    patch, breaking -> major), rewrites the version in VERSION / .cz.toml /
#    CITATION.cff / core CMake and regenerates CHANGELOG.md. The `propose` job
#    puts that on the bot branch `bot/release` and opens (or updates) the PR
#    `chore(release): bump version A to B` (.github/actions/bot-pr), with the
#    bot token so CI runs on it. Nothing is tagged or published.
# 2. Merge that PR. Its squash commit on main (VERSION changed, title
#    `chore(release): bump version ...`) starts this workflow on `push`: the
#    `release` job builds the lean install bundle from the merged commit,
#    checksums, attests and verifies it, and the `publish` job tags that
#    commit v<VERSION> and publishes the GitHub Release. Tags are outside the
#    branch ruleset, so the workflow token pushes the tag.
#
# mode=dryrun bumps, builds, attests and verifies on the runner, then stops:
# nothing is pushed, proposed or published (#614). mode=baseline releases
# the current VERSION at main's head as-is (once, for v0.1.0).
#
# The tag pushed with the workflow token starts no other workflow, so the
# images job is a direct dependency, not a tag trigger. Once the repo is
# linked to Zenodo, each published release is archived + gets a DOI; add it to
# CITATION.cff afterwards.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bump = open the bump PR (merging it releases); baseline = release the current VERSION as-is (use once, for v0.1.0); dryrun = bump, build, attest and verify on the runner, then stop: nothing is pushed or published (#614)"
        type: choice
        options: [bump, baseline, dryrun]
        default: bump
  push:
    branches: [main]
    paths: [VERSION]

# Read-only by default; each job that writes declares its own scopes
# below (Scorecard Token-Permissions, #785).
permissions:
  contents: read

# One run per commit at a time, never cancelled. Not one group for the whole
# workflow: with cancel-in-progress false a group keeps one pending run, so a
# later dispatch or push would replace a merged bump's pending release and
# leave that version unpublished. Distinct commits release distinct versions
# (the tag checks below refuse a version tagged elsewhere).
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Step 1: the bump as a PR (#882).
  propose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bump' }}
    runs-on: ubuntu-24.04
    # contents + pull-requests: write only to open the PR with the workflow
    # token when no bot token is configured (#705); CI then needs a close and
    # reopen of the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags for cz to compute the bump
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install commitizen
        timeout-minutes: 10
        run: pip install --require-hashes -r requirements/commitizen.txt
      - name: Bump (files only)
        id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          old="$(tr -d '[:space:]' < VERSION)"
          # cz rewrites `version:` in CITATION.cff but not the release date, so
          # stamp today's date first (the merge day can differ; the PR can be
          # refreshed by dispatching bump again).
          sed -i -E "s/^date-released:.*/date-released: \"$(date -u +%Y-%m-%d)\"/" CITATION.cff
          cz bump --yes --changelog
          ver="$(tr -d '[:space:]' < VERSION)"
          # Keep the files, drop cz's commit and tag: the tag goes on the merged
          # commit (publish job), and bot-pr makes the commit.
          git tag -d "v${ver}"
          git reset -q --soft HEAD~1
          echo "title=chore(release): bump version ${old} to ${ver}" >> "$GITHUB_OUTPUT"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/bot-pr
        id: pr
        with:
          branch: bot/release
          title: ${{ steps.bump.outputs.title }}
          body: "Commitizen's bump to v${{ steps.bump.outputs.ver }} from the commits since the last tag (`CHANGELOG.md` has the notes). **Merging this PR releases v${{ steps.bump.outputs.ver }}:** release.yml runs on the merge, builds, attests and verifies the merged commit, tags it and publishes the GitHub Release (#882). If main moves before the merge, dispatch mode=bump again to refresh the changelog."
          paths: VERSION .cz.toml CITATION.cff CHANGELOG.md core/CMakeLists.txt
          labels: packaging
          org-app-id: ${{ secrets.BOT_APP_ID }}
          org-app-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          app-key: ${{ secrets.AHN_BOT_APP_KEY }}
          token: ${{ secrets.ORG_BOT_TOKEN }}
      # bot-pr only warns when GitHub refuses the PR (the chart bots can wait
      # for their next run); a bump with no PR cannot release, so it fails.
      - name: Fail when the bump PR was not opened
        if: ${{ steps.pr.outputs.result == 'not-opened' }}
        run: |
          echo "::error::bot/release is pushed but its PR could not be opened; open it by hand or fix the token and dispatch mode=bump again."
          exit 1

  # Step 2: build, attest and verify the release commit (the merged bump, the
  # baseline head, or a dry run's local bump); push and publish nothing (the
  # publish job does). It runs repository code (make test, the bundle
  # scripts), so it holds no write token.
  release:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'bump') ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version ')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # which PR a pushed release commit came from
      id-token: write      # keyless Sigstore signing of the attestations (#614)
      attestations: write  # store build provenance + SBOM attestations (#614)
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      ver: ${{ steps.handover.outputs.ver }}
      sha256: ${{ steps.handover.outputs.sha256 }}
      mod_sha256: ${{ steps.handover.outputs.mod_sha256 }}
    steps:
      # The title alone is not enough: any squash-merged PR that changes
      # VERSION could carry it. A pushed release must be the merge of the
      # Commitizen PR the propose job opened, from this repository's
      # bot/release branch.
      - name: The pushed commit is the merged bump PR (push only)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null) | "\(.head.repo.full_name):\(.head.ref)"] | .[0] // empty')
          if [ "$from" != "${GITHUB_REPOSITORY}:bot/release" ]; then
            echo "FAIL: ${GITHUB_SHA} is not the merge of a bot/release PR (came from '${from:-no PR}'); not releasing"
            exit 1
          fi
          echo "Release commit from ${from}."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags for cz to compute the bump
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install tools
        # commitizen is pinned, with hashes, in requirements/ (#787): it computes the semver
        # bump from commit history and rewrites the version strings, and this
        # workflow is never exercised by PR CI, so a float would first be
        # noticed as a wrong release number.
        #
        # cmake and g++ come with the GitHub-hosted Ubuntu image, so there is
        # no apt step: on 2026-10-07 `apt-get update` hung on the Ubuntu
        # archive for 26+ minutes in two consecutive v1.9.0 release runs
        # (37673285198, 37681037542), before anything was committed or tagged.
        # The version checks fail fast if a future image drops either tool, and
        # the timeout bounds any other hang here.
        timeout-minutes: 10
        run: |
          pip install --require-hashes -r requirements/commitizen.txt
          cmake --version
          g++ --version

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute version (merged bump, baseline or dry-run bump)
        id: compute
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "dryrun" ]; then
            # As step 1 would, on the runner only.
            sed -i -E "s/^date-released:.*/date-released: \"$(date -u +%Y-%m-%d)\"/" CITATION.cff
            cz bump --yes --changelog
            ver="$(tr -d '[:space:]' < VERSION)"
          else
            ver="$(tr -d '[:space:]' < VERSION)"
            # A tag on this commit is a re-run after a failed publish: build again
            # and let publish resume. A tag elsewhere means the version is taken.
            if tagged=$(git rev-parse -q --verify "refs/tags/v${ver}^{commit}"); then
              if [ "$tagged" != "$GITHUB_SHA" ]; then
                echo "FAIL: v${ver} is already tagged on ${tagged}, not ${GITHUB_SHA}"; exit 1
              fi
              echo "v${ver} already tags ${GITHUB_SHA}: a re-run, publish resumes."
            fi
          fi
          echo "VER=${ver}" >> "$GITHUB_ENV"
          echo "TAG=v${ver}" >> "$GITHUB_ENV"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"   # for the images job

      - name: Sanity build + test (core)
        run: make test

      - name: Check the package contents
        # The same gate CI runs on PRs (#604): no agent files, no caches, the
        # shipped tools' dependencies present, git archive clean.
        run: tools/release/check-bundle.sh

      - name: Assemble install bundle
        # One definition of what ships, shared with the gate above (#604).
        run: |
          name="anthocnet-${VER}"
          tools/release/assemble-bundle.sh "$VER" dist
          ( cd dist && zip -qr "${name}.zip" "${name}" )
          ls -lh "dist/${name}.zip"

      - name: Checksum the bundle
        # Zero-dependency integrity signal (#337). `sha256sum` writes the
        # canonical "<digest>  <name>" line, so the .sha256 file is directly
        # consumable by `sha256sum -c` in the directory the zip was downloaded
        # to — hence the subshell: the recorded name must be bare, not "dist/…".
        # The digest is *also* inlined in the release body below, so a reader
        # can check a download against the release page without having to trust
        # a second downloaded file.
        run: |
          ( cd dist && sha256sum "anthocnet-${VER}.zip" > "anthocnet-${VER}.zip.sha256" )
          cat "dist/anthocnet-${VER}.zip.sha256"
          echo "SHA256=$(cut -d' ' -f1 < "dist/anthocnet-${VER}.zip.sha256")" >> "$GITHUB_ENV"

      - name: Build the drop-in ns-3 module tarball (#606)
        # The four contrib modules exactly as `make install-ns3` lays them out,
        # so a user without a checkout runs one `tar -xzf … -C ns-3/contrib`.
        # Deterministic (sorted, fixed owner/mtime, gzip -n).
        run: |
          tools/release/module-tarball.sh "$VER" dist
          ( cd dist && sha256sum "anthocnet-ns3-modules-${VER}.tar.gz" > "anthocnet-ns3-modules-${VER}.tar.gz.sha256" )
          cat "dist/anthocnet-ns3-modules-${VER}.tar.gz.sha256"
          echo "MOD_SHA256=$(cut -d' ' -f1 < "dist/anthocnet-ns3-modules-${VER}.tar.gz.sha256")" >> "$GITHUB_ENV"
          # The same run writes the standalone harness and adaptive-arms
          # packages (#770); checksum them the same way.
          for p in routing-bench adaptive; do
            ( cd dist && sha256sum "$p-${VER}.tar.gz" > "$p-${VER}.tar.gz.sha256" )
            cat "dist/$p-${VER}.tar.gz.sha256"
          done

      - name: Bake recipe for this release (#613)
        # ns-3's own installer: the module tarball above as an ns-contrib
        # module. bake.yml tests the same template against a served tarball.
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/anthocnet-ns3-modules-${VER}.tar.gz"
          sed -e "s|@URL@|${url}|" -e "s|@VERSION@|${VER}|" packaging/bake/anthocnet.xml.in \
            > "dist/anthocnet-${VER}.bakeconf.xml"

      - name: SBOM of the install bundle (#614)
        # SPDX JSON of what ships: the unpacked bundle directory that the zip
        # is made from, so the SBOM describes exactly the released files.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/anthocnet-${{ env.VER }}
          format: spdx-json
          output-file: dist/anthocnet-${{ env.VER }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance (#614)
        # SLSA provenance for both downloads, signed keylessly with this
        # workflow's OIDC identity and stored in GitHub's attestation store.
        # The Sigstore bundle is also attached to the release, so it can be
        # checked offline and Scorecard's Signed-Releases check finds it.
        # actions/attest itself, not the attest-build-provenance wrapper
        # (CONTRIBUTING.md, "Provenance": the wrapper's own README points here).
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/anthocnet-${{ env.VER }}.zip
            dist/anthocnet-ns3-modules-${{ env.VER }}.tar.gz
            dist/routing-bench-${{ env.VER }}.tar.gz
            dist/adaptive-${{ env.VER }}.tar.gz

      - name: Attest the SBOM (#614)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/anthocnet-${{ env.VER }}.zip
          sbom-path: dist/anthocnet-${{ env.VER }}.spdx.json

      - name: Verify what was just attested (#614)
        # The same commands SECURITY.md gives users, run before publishing: a
        # release whose attestations do not verify never goes out.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" "dist/anthocnet-${VER}.provenance.sigstore.json"
          # The same provenance under the name Scorecard's Signed-Releases
          # recognises as SLSA provenance, `*.intoto.jsonl` (#788): the
          # bundle's signed DSSE envelope on one line, the format
          # slsa-github-generator publishes. The .sigstore.json stays, for
          # `gh attestation verify --bundle` and cosign users.
          jq -c '.dsseEnvelope' "dist/anthocnet-${VER}.provenance.sigstore.json" > "dist/anthocnet-${VER}.intoto.jsonl"
          test "$(jq -r '.payloadType' "dist/anthocnet-${VER}.intoto.jsonl")" = "application/vnd.in-toto+json"
          test "$(wc -l < "dist/anthocnet-${VER}.intoto.jsonl")" -eq 1
          for f in "dist/anthocnet-${VER}.zip" "dist/anthocnet-ns3-modules-${VER}.tar.gz" \
                   "dist/routing-bench-${VER}.tar.gz" "dist/adaptive-${VER}.tar.gz"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          spdx=$(jq -r '.spdxVersion | sub("^SPDX-"; "")' "dist/anthocnet-${VER}.spdx.json")   # e.g. 2.3
          gh attestation verify "dist/anthocnet-${VER}.zip" --repo "$GITHUB_REPOSITORY" --predicate-type "https://spdx.dev/Document/v${spdx}"

      - name: Hand the release over to the publish job
        id: handover
        if: ${{ inputs.mode != 'dryrun' }}
        run: |
          { echo "ver=${VER}"; echo "sha256=${SHA256}"; echo "mod_sha256=${MOD_SHA256}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.mode != 'dryrun' }}
        with:
          name: release-dist
          path: dist/
          retention-days: 1

  # Tags the release commit, updates the ns3-module branch and publishes the
  # GitHub Release. It runs no code from the build: it checks out the commit
  # this run is for (the merged bump, or main's head for a baseline) and
  # takes only the built files. Tags and ns3-module are outside main's
  # ruleset, so the workflow token pushes both; nothing here pushes to main.
  publish:
    needs: release
    if: ${{ inputs.mode != 'dryrun' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the tag, the ns3-module push and the GitHub Release
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VER: ${{ needs.release.outputs.ver }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      MOD_SHA256: ${{ needs.release.outputs.mod_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Tag the release commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent, so a re-run after a later step failed resumes: a tag
          # already on this commit is kept; one on another commit fails.
          # The peeled line (^{}) of an annotated tag sorts last; a lightweight
          # tag has only its own line.
          tagged=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | cut -f1)
          if [ -n "$tagged" ]; then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "FAIL: ${TAG} already tags ${tagged}, not ${GITHUB_SHA}"; exit 1
            fi
            echo "${TAG} already tags ${GITHUB_SHA}; resuming."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}" "$GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/${TAG}"

      - name: Update the generated ns3-module branch (#606)
        # The tarball's contents as an orphan commit on `ns3-module`, replaced
        # on every release, for users who prefer git over a download:
        #   git clone -b ns3-module --depth 1 <repo> m && cp -r m/* ns-3/contrib/
        # Built in a scratch index so the workspace and its history are not
        # touched; pushed with the workflow token (ns3-module is not under the
        # ruleset).
        # It only moves forward: runs are per commit, so two releases can
        # overlap, and the older one must not replace a newer ns3-module. The
        # version is read from the tip's subject ("AntHocNet vX.Y.Z: ..."); a
        # tip at this version or newer is left alone (a re-run, or a newer
        # release already there), and the push leases the tip it compared
        # against, so a release that lands in between makes this one look
        # again rather than overwrite it. Both releases still tag and publish.
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          tar -xzf "dist/anthocnet-ns3-modules-${VER}.tar.gz" -C "$tmp"
          GIT_INDEX_FILE="$(mktemp -u)"
          export GIT_INDEX_FILE
          git read-tree --empty
          git --work-tree="$tmp" add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "AntHocNet ${TAG}: drop-in ns-3 modules (generated by release.yml; do not edit)")
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          authgit() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          for attempt in 1 2 3; do
            tip=$(authgit ls-remote origin refs/heads/ns3-module | cut -f1)
            if [ -n "$tip" ]; then
              authgit fetch -q --depth 1 origin "$tip"
              have=$(git log -1 --format=%s "$tip" | sed -nE 's/^AntHocNet v([^:]+):.*/\1/p')
              if [ -n "$have" ] && [ "$(printf '%s\n%s\n' "$have" "$VER" | sort -V | tail -n 1)" = "$have" ]; then
                echo "ns3-module already holds v${have} (>= v${VER}); left as it is."
                exit 0
              fi
            fi
            # An empty lease value means "the branch must not exist yet".
            if authgit push --force-with-lease="refs/heads/ns3-module:${tip}" origin "${commit}:refs/heads/ns3-module"; then
              echo "ns3-module: ${tip:-none} -> ${commit} (v${VER})"
              exit 0
            fi
            echo "ns3-module moved while this run compared (attempt ${attempt}); reading it again."
          done
          echo "FAIL: could not update ns3-module after 3 attempts"; exit 1

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/anthocnet-${{ env.VER }}.zip
            dist/anthocnet-${{ env.VER }}.zip.sha256
            dist/anthocnet-ns3-modules-${{ env.VER }}.tar.gz
            dist/anthocnet-ns3-modules-${{ env.VER }}.tar.gz.sha256
            dist/routing-bench-${{ env.VER }}.tar.gz
            dist/routing-bench-${{ env.VER }}.tar.gz.sha256
            dist/adaptive-${{ env.VER }}.tar.gz
            dist/adaptive-${{ env.VER }}.tar.gz.sha256
            dist/anthocnet-${{ env.VER }}.spdx.json
            dist/anthocnet-${{ env.VER }}.bakeconf.xml
            dist/anthocnet-${{ env.VER }}.provenance.sigstore.json
            dist/anthocnet-${{ env.VER }}.intoto.jsonl
          generate_release_notes: true
          body: |
            AntHocNet ${{ env.TAG }}. Release notes: https://swarm-routing.github.io/AntHocNet/docs/releases/${{ env.TAG }}/
            (from [CHANGELOG.md](https://github.com/swarm-routing/AntHocNet/blob/${{ env.TAG }}/CHANGELOG.md); the site redeploys when this run finishes).

            **Install bundle** (`anthocnet-${{ env.VER }}.zip`) — the source to
            drop onto your own simulator tree:
            `make doctor NS3DIR=…` then `make install-ns3 NS3DIR=…`
            (`BASELINES=0` for AntHocNet alone).

            **Drop-in ns-3 modules** (`anthocnet-ns3-modules-${{ env.VER }}.tar.gz`):
            no checkout needed, `tar -xzf anthocnet-ns3-modules-${{ env.VER }}.tar.gz -C /path/to/ns-3/contrib`,
            then configure and build ns-3. The same files are on the generated
            `ns3-module` branch. SHA-256: `${{ env.MOD_SHA256 }}`.
            **With bake** (ns-3's installer): copy `anthocnet-${{ env.VER }}.bakeconf.xml`
            into your bake checkout's `contrib/`, then
            `./bake.py configure -e ns-3.42 -e anthocnet && ./bake.py download && ./bake.py build`.

            **Without AntHocNet** (#770): `routing-bench-${{ env.VER }}.tar.gz` is the
            comparison harness with the stock ns-3 arms, and `adaptive-${{ env.VER }}.tar.gz`
            adds the ARA, Termite, Q-routing and BeeAdHoc arms. Unpack either or both into
            `ns-3/contrib`. Both are covered by the same provenance attestation.

            **Container images** (see `docker/README.md`): `ghcr.io/swarm-routing/anthocnet-ns3:${{ env.TAG }}-optimized`
            and `:${{ env.TAG }}-debug`, ns-3 with every module of this release built and tested,
            `FROM` a pinned `ghcr.io/swarm-routing/ns3-dev` digest (label `io.github.swarm-routing.ns3-dev.digest`).

            **Verify your download.** The SHA-256 digest is published twice — in
            this body and as the `anthocnet-${{ env.VER }}.zip.sha256` asset:

            ```
            ${{ env.SHA256 }}  anthocnet-${{ env.VER }}.zip
            ```

            ```
            sha256sum -c anthocnet-${{ env.VER }}.zip.sha256   # both files in the same directory
            ```

            **Verify where it came from.** Both downloads carry signed SLSA
            build provenance, and the bundle an SPDX SBOM
            (`anthocnet-${{ env.VER }}.spdx.json`). With the GitHub CLI:

            ```
            gh attestation verify anthocnet-${{ env.VER }}.zip --repo ${{ github.repository }}
            ```

            The images are signed with cosign (keyless). See
            [SECURITY.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/SECURITY.md#verifying-a-release).

  # Release images on ns3-containers (#866, swarm-routing/.github#107):
  # ghcr.io/swarm-routing/anthocnet-ns3:<tag>-{optimized,debug}, each FROM the
  # digest of ns3-dev:<version>-<profile>, built with swarm-routing/.github's
  # reusable-ns3-image.yml (test.py suites on the built image, then push, cosign
  # signature, provenance + CycloneDX SBOM, signature verified). No ns-3 is
  # built here any more; images.yml and docker/Dockerfile.ns3 are retired.
  #
  # The reusable workflow checks out the commit this run was dispatched at,
  # which precedes the bump commit; the stage moves to the release tag the
  # publish job just pushed (a public repo: an anonymous fetch), so the image's
  # revision label is the tagged commit. A dry run pushes no tag: it builds and
  # tests both images from the dispatched commit and pushes nothing.
  #
  # ns-3 3.48, not `latest`: the release ships the AODV-family arms (aomdv, the
  # harness's stock aodv), which livelock on ns-3.49 (#843). Move to `latest`
  # when #843 closes.
  #
  # A direct job dependency (workflow_call), not a tag `push` trigger: a tag
  # pushed with the release job's GITHUB_TOKEN starts no other workflow.
  images:
    # After the publish job pushed the tag; in a dry run (no publish) right
    # after the release job, building and testing without a push.
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && (inputs.mode == 'dryrun' || needs.publish.result == 'success') }}
    permissions:
      contents: read
      packages: write       # push (not used by a dry run)
      id-token: write       # cosign keyless signature
      attestations: write   # build provenance and the SBOM
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-image.yml@main
    with:
      stage: >-
        ${{ inputs.mode != 'dryrun' && format('git fetch -q --depth 1 origin tag {0} && git checkout -q {0} &&', needs.release.outputs.tag) || '' }}
        mkdir -p .stage/contrib && touch .stage/CMakeLists.txt &&
        make -s install-ns3 NS3DIR="$PWD/.stage" BASELINES=1
      modules: >-
        routing-bench=.stage/contrib/routing-bench oracle=.stage/contrib/oracle
        aomdv=.stage/contrib/aomdv gpsr=.stage/contrib/gpsr
        adaptive=.stage/contrib/adaptive anthocnet=.stage/contrib/anthocnet
      # The suites ci-ns3.yml runs (gpsr has none).
      test-suites: anthocnet oracle adaptive routing-bench
      ns3-version: '3.48'
      profiles: '["optimized", "debug"]'
      image: anthocnet-ns3
      tag: ${{ needs.release.outputs.tag }}
      push: ${{ inputs.mode != 'dryrun' }}
