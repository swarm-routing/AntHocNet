name: PR title

# We squash-merge, so the PR title becomes the commit on main and is what
# Commitizen reads to compute the next version. The title must be a lowercase
# Conventional Commit (CONTRIBUTING.md): the org's reusable check does it, with
# the same type list as CONTRIBUTING.md here, and skips Dependabot (#864).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  lint-title:
    # `edited` also fires when only the description changes, e.g. when
    # CodeRabbit writes its summary into it a minute after the PR opens; that
    # ran the check a second time on the same commit and title (#864). Check
    # an edit only when it changed the title.
    if: github.event.action != 'edited' || github.event.changes.title != null
    # @main, not a SHA, on purpose: the org's reusable workflows are called at
    # @main by contract (swarm-routing/.github AGENTS.md). Scorecard's
    # Pinned-Dependencies flags each such line; this repo accepts that warning
    # (#787, CONTRIBUTING.md "Automated: OpenSSF Scorecard").
    uses: swarm-routing/.github/.github/workflows/reusable-pr-title.yml@main
