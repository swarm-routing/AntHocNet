name: Licence

# The org licence gate (swarm-routing/.github reusable-licence-check.yml), next
# to this repository's own docs/tools/check-headers.py (lint.yml): SPDX lines
# per directory (LICENSING.md) and the one-way include rule, checked against
# swarm-core: a core/ file includes only the C++ standard library, other core/
# files and swarm-core's dual-licensed core/ at the release swarm-core.lock
# names (this core-deps is the commit its tag names; `swarm-core / pin` checks
# that every place agrees). swarm-routing/ns3-swarm-core#14.
# .claude/ and .devcontainer/ carry no SPDX line (not source that ships).
on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@9a1ce0ffeda6916186f97b0c5a7678bcbc7578ad # main@2026-11-24
    with:
      dual-roots: core/ tools/ ns3/tools/ docs/tools/
      core-roots: core/
      gpl-only: docs/tools/mkdocs_hooks.py
      exclude: '^(\.claude|\.devcontainer)/'
      core-deps: swarm-routing/swarm-core@5fb7c180ea3a88a71b99b7c3d11dc8e2eeccb7d4:core
