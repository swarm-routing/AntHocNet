name: Benchmark cell
# The label `ns3-campaign dispatch` and `campaign.py dispatch` find a run by.
run-name: ${{ inputs.label || inputs.cell || 'benchmark cell' }}

# One benchmark cell (one harness invocation, any number of seeds) on one
# commit pinned by `source_sha` (#905, swarm-routing/.github#156). Whatever
# ref this is dispatched at, every path checks out `source_sha` and fails
# unless HEAD is that commit, so a campaign dispatched over hours from a moving
# branch tests one commit in every cell (#867). ##PROV## commit= names it.
#
# Two paths, chosen by `image`:
#
# - `image` (a campaign image by digest, built by campaign-image.yml from
#   `source_sha`): the job `cell` is swarm-routing/.github's
#   reusable-benchmark-cell.yml@main in prebuilt mode. It checks the image's
#   labels name this repository at `source_sha`, runs the harness with
#   `./ns3 run --no-build` (every cell of a campaign runs one binary, #866) and
#   uploads the artifact `benchmark-cell` (results.txt with ##ARGS##/##PROV##,
#   kept 7 days; `benchmark-cell-<key>` when `key` is given). `verdict` adds
#   the scenario_check verdict. Campaigns go through `ns3-campaign`
#   (swarm-routing/ns3-tools), which dispatches this path with image,
#   source_sha, harness, args, cell, label and `key`, the cell key over every
#   pinned input, so a re-dispatched campaign reuses a cell already run
#   (swarm-routing/ns3-tools#155).
# - no `image` (the legacy in-job build): the job `legacy` runs in this repo's
#   historical ghcr.io/swarm-routing/ns3:<version> image (3.36, 3.41, 3.42,
#   3.42-opt, 3.47, 3.48; frozen since images.yml was retired), or in
#   `legacy_image` given by digest (a control re-running a published cell in
#   the image its ##PROV## names, ghcr.io/danieljoppi/ns3@sha256:..., #867),
#   and installs, configures and builds the module from `source_sha` in the
#   job. Those images hold ns-3 only. It is the path for replay traces (#641)
#   and for the legacy arm of a control; `tools/bench/campaign.py` dispatches
#   it for plans with legacy images, and nothing else.
#
# Both paths share this workflow, so a campaign's two legs count against one
# runner cap (both tools count this workflow's queued and running runs).
#
# `open_pr` opens a PR that adds the cell to results/cells/ (and the replay
# trace to results/replay/) with its provenance and its scenario_check
# verdict. The bot PR is opened with a GitHub App installation token, first
# that works: the org App (secrets BOT_APP_ID / BOT_APP_PRIVATE_KEY, org
# secrets for every repository, swarm-routing/.github#21), else this
# repository's own app (#705: variable AHN_BOT_APP_ID and secret
# AHN_BOT_APP_KEY, contents: write and pull-requests: write on this
# repository); the commit is made as that App's bot user. Pushes and PRs made
# with an app token start the normal PR workflows, so the cell PR gets CI
# (lint, the replay check) and can auto-merge (#616). Without either the job
# falls back to the workflow's own token, with two consequences:
# - it needs the repository setting "Allow GitHub Actions to create and
#   approve pull requests"; without it the branch is still pushed, and the
#   job summary links it;
# - CI does not run on a PR a workflow token opens; close and reopen it if a
#   check is wanted. The job prints a notice saying so.
#
# `args` is the harness's own command line, so every dispatch shape of the
# workflows retired in v2.5.0 (#746) fits; the campaign tools translate
# committed plans that still name them. rescue-artifacts.yml is recovery, not
# a dispatch shape, and stays.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Campaign image by digest (campaign-image.yml): ghcr.io/swarm-routing/anthocnet-ns3-campaign@sha256:...; empty = the legacy in-job build'
        default: ''
      source_sha:
        description: '40-char commit every cell checks out, whatever the dispatch ref (the image must be built from it)'
        required: true
      harness:
        description: 'routing-compare or its alias anthocnet-compare (MANET/mesh/FANET/VANET) | isl-grid | leo-walker (ns-3 >= 3.48)'
        default: routing-compare
      args:
        description: 'The harness flags, verbatim (e.g. --scenario=paper --runs=20 --protocols=anthocnet,aodv,olsr,dsdv,oracle --diag)'
        required: true
      seeds:
        description: 'Image path only: RngRun range <first>-<last>, appended as --firstRun/--runs; empty = in args'
        default: ''
      cell:
        description: 'Cell name ([a-z0-9][a-z0-9._-]*): the PR adds results/cells/<cell>.txt (required with open_pr)'
        default: ''
      label:
        description: 'Run name (<generation>/<arm>/<cell>), set by the campaign tools'
        default: ''
      key:
        description: 'Cell key (64 hex) ns3-campaign computes over every pinned input; written into ##PROV## and the artifact name, so a later campaign reuses the cell; empty = none'
        default: ''
      version:
        description: 'Legacy path only (no image): ghcr.io/swarm-routing/ns3:<version>, e.g. 3.42-opt; 3.48 for leo-walker'
        default: '3.42-opt'
      legacy_image:
        description: 'Legacy path only (#867): run in this image instead of ns3:<version>, by digest (ghcr.io/<owner>/<name>@sha256:...)'
        default: ''
      title:
        description: "With open_pr: one line for the cell's header, e.g. 'static mesh (paper field, pause=900, disk) 20 seeds'"
        default: ''
      replay:
        description: 'Legacy path only: ns-3 replay id (#641: manet, mesh, fanet, vanet, isl, leo); also record the first anthocnet run with --vizTrace; the PR adds results/replay/<id>.jsonl'
        default: ''
      published:
        description: 'With replay: the published cell the trace must match (results/cells/<name>.txt, checked by check-viz-trace.py)'
        default: ''
      open_pr:
        description: 'Open a PR adding the cell and/or the replay trace (with provenance and the checks)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  inputs:
    name: check the inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - name: Check the inputs
        env:
          IMAGE: ${{ inputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SEEDS: ${{ inputs.seeds }}
          CELL: ${{ inputs.cell }}
          LEGACY_IMAGE: ${{ inputs.legacy_image }}
          REPLAY: ${{ inputs.replay }}
          PUBLISHED: ${{ inputs.published }}
          OPEN_PR: ${{ inputs.open_pr }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::source_sha must be a 40-char commit (got '$SOURCE_SHA')"; exit 1; }
          for v in "$CELL" "$REPLAY" "$PUBLISHED"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "::error::names must be [a-z0-9][a-z0-9._-]* (got '$v')"; exit 1
            fi
          done
          if [ "$OPEN_PR" = true ] && [ -z "$CELL$REPLAY" ]; then
            echo "::error::open_pr needs a cell and/or a replay name"; exit 1
          fi
          if [ -n "$IMAGE" ]; then
            # The reusable cell checks the image itself; these belong to the
            # legacy in-job build only.
            for pair in "legacy_image=$LEGACY_IMAGE" "replay=$REPLAY" "published=$PUBLISHED"; do
              [ -z "${pair#*=}" ] \
                || { echo "::error::${pair%%=*} is the legacy path (no image); it cannot be combined with image"; exit 1; }
            done
            echo "image path: $IMAGE at $SOURCE_SHA"
          else
            [ -z "$SEEDS" ] \
              || { echo "::error::seeds is the image path only; give --firstRun/--runs in args"; exit 1; }
            if [ -n "$LEGACY_IMAGE" ]; then
              # A control's image is pinned by digest, never by a tag (#867).
              [[ "$LEGACY_IMAGE" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] \
                || { echo "::error::legacy_image must be ghcr.io/<owner>/<name>@sha256:<64 hex> (got '$LEGACY_IMAGE')"; exit 1; }
            fi
            echo "legacy path in ${LEGACY_IMAGE:-ns3:<version>} at $SOURCE_SHA"
          fi

  # The image path: the org's reusable cell (swarm-routing/.github#157).
  cell:
    needs: inputs
    if: ${{ inputs.image != '' }}
    permissions:
      contents: read
      packages: read
    uses: swarm-routing/.github/.github/workflows/reusable-benchmark-cell.yml@main
    with:
      image: ${{ inputs.image }}
      source_sha: ${{ inputs.source_sha }}
      harness: ${{ inputs.harness }}
      args: ${{ inputs.args }}
      seeds: ${{ inputs.seeds }}
      cell: ${{ inputs.cell }}
      key: ${{ inputs.key }}

  # scenario_check on the image path's results, with the tools of source_sha.
  verdict:
    name: scenario_check verdict
    needs: cell
    if: ${{ always() && inputs.image != '' && needs.cell.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.key != '' && format('benchmark-cell-{0}', inputs.key) || 'benchmark-cell' }}
          path: ${{ runner.temp }}/cell
      - name: scenario_check verdict
        run: |
          set -o pipefail
          f="$RUNNER_TEMP/cell/results.txt"
          [ -f "$f" ] || { echo "::error::no results.txt in the cell's artifact"; exit 1; }
          python3 tools/bench/scenario_check.py results "$f" | tee "$RUNNER_TEMP/verdict.txt"
          { echo '```'; cat "$RUNNER_TEMP/verdict.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-cell-verdict
          path: ${{ runner.temp }}/verdict.txt
          if-no-files-found: ignore
          retention-days: 7

  # The legacy in-job build (#867's old arm, replay traces).
  legacy:
    name: ${{ inputs.harness }} ${{ inputs.cell }} (legacy build)
    needs: inputs
    if: ${{ inputs.image == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360   # the hosted-runner ceiling (#121)
    container:
      image: ${{ inputs.legacy_image || format('ghcr.io/swarm-routing/ns3:{0}', inputs.version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner (it needs sudo on the VM).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned commit, not the dispatch ref (#867, #905).
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: HEAD must be source_sha
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SOURCE_SHA" ]; then
            echo "::error::checked out $head, not source_sha $SOURCE_SHA; refusing to run the cell"
            exit 1
          fi
          echo "checked out ${GITHUB_REPOSITORY}@${head} (dispatched at ${GITHUB_REF_NAME} = ${GITHUB_SHA})"
      - name: Install AntHocNet module
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Resolve ns-3 build profile (#123)
        # State the image's profile explicitly, so the reconfigure never
        # downgrades an optimized image, and the profile is in ##PROV##.
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          env_file=/opt/ns-3/.swarm-configure.env
          if [ -f "$env_file" ]; then
            # An ns3-dev image (swarm-routing/ns3-containers) records the
            # configure flags it was built with.
            # shellcheck disable=SC1090
            . "$env_file"
            flag=${NS3_PROFILE_FLAGS:-}
            profile=$(printf '%s\n' "$flag" | sed -n 's/.*-d \([a-z]*\).*/\1/p')
            [ -n "$profile" ] || { echo "::error::no -d <profile> in NS3_PROFILE_FLAGS='$flag' ($env_file)"; exit 1; }
            src="$env_file: NS3_PROFILE_FLAGS='$flag'"
          elif [ -n "${NS3_PROFILE:-}" ]; then
            # This repo's historical images (docker/Dockerfile.ns3, retired).
            profile=$NS3_PROFILE; src="NS3_PROFILE=$NS3_PROFILE (image environment)"
          else
            case "$VERSION_TAG" in *-opt) profile=release ;; *) profile=default ;; esac
            src="tag suffix of ns3:$VERSION_TAG"
          fi
          if [ -z "${flag+x}" ]; then
            flag=""
            [ "$profile" = "default" ] || flag="-d $profile"
          fi
          echo "ns-3 build profile: $profile (from $src)"
          {
            echo "NS3_PROFILE=$profile"
            echo "NS3_PROFILE_FLAG=$flag"
          } >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cd /opt/ns-3
          # $NS3_PROFILE_FLAG unquoted on purpose: empty must expand to nothing.
          ./ns3 configure $NS3_PROFILE_FLAG --enable-examples \
            --enable-modules='anthocnet;aomdv;gpsr;oracle;adaptive;routing-bench;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point;mesh'
          ./ns3 build && ./ns3 show profile
      - name: Run the cell
        # Stop the run 20 min before the job ceiling, so the always() steps
        # still upload the stderr tail and a stub results file that collect
        # recognises as a missing run (#746).
        timeout-minutes: 340
        shell: bash
        env:
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          REPLAY: ${{ inputs.replay }}
        run: |
          cd /opt/ns-3
          set -o pipefail
          # A plan names repo fixtures as $GITHUB_WORKSPACE/... (the disaster
          # trace, the Termite anchor flows). The input arrives as literal
          # text, so expand that one variable here; ##ARGS## keeps the literal.
          ARGS="${ARGS//\$GITHUB_WORKSPACE/$GITHUB_WORKSPACE}"
          [ -n "$REPLAY" ] && ARGS="$ARGS --vizTrace=$GITHUB_WORKSPACE/replay.jsonl"
          timewrap=""
          [ -x /usr/bin/time ] && timewrap="/usr/bin/time -v -o $GITHUB_WORKSPACE/time-v.log"
          # #256: cap the address space below the
          # runner's, so an over-large cell dies by bad_alloc and keeps its logs.
          ulimit -v 13631488 || true
          echo "running: $HARNESS $ARGS"
          # $timewrap unquoted on purpose: empty must expand to nothing.
          $timewrap ./ns3 run "$HARNESS $ARGS" 2>"$GITHUB_WORKSPACE/ns3-stderr.log" \
            | tee "$GITHUB_WORKSPACE/results.txt" \
            || { echo "--- ns-3 run FAILED; stderr tail ---"; tail -n 60 "$GITHUB_WORKSPACE/ns3-stderr.log"; exit 1; }
      - name: Stamp provenance into the results file (#674)
        if: always()
        shell: bash
        env:
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          VERSION_TAG: ${{ inputs.version }}
          LEGACY_IMAGE: ${{ inputs.legacy_image }}
        run: |
          # Append-only (methodology "Measuring commit"): commit= is
          # source_sha, the commit this job checked out and built (#905).
          prov="##PROV## commit=$SOURCE_SHA ref=$GITHUB_REF_NAME run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT image=${LEGACY_IMAGE:-ghcr.io/swarm-routing/ns3:$VERSION_TAG} profile=$NS3_PROFILE harness=$HARNESS"
          echo "AHN_PROV=$prov" >> "$GITHUB_ENV"
          if [ -f "$GITHUB_WORKSPACE/results.txt" ]; then
            echo "##ARGS## $HARNESS $ARGS" >> "$GITHUB_WORKSPACE/results.txt"
            echo "$prov" >> "$GITHUB_WORKSPACE/results.txt"
          fi
      - name: scenario_check verdict
        if: always()
        shell: bash
        run: |
          [ -f "$GITHUB_WORKSPACE/results.txt" ] || exit 0
          python3 tools/bench/scenario_check.py results "$GITHUB_WORKSPACE/results.txt" \
            | tee "$GITHUB_WORKSPACE/verdict.txt"
      - name: Check the replay trace against the published cell (#641)
        if: ${{ inputs.replay != '' }}
        shell: bash
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          cell=""
          [ -n "$PUBLISHED" ] && cell="--cell results/cells/${PUBLISHED}.txt"
          # $cell unquoted on purpose: empty must expand to nothing.
          python3 tools/bench/check-viz-trace.py "$GITHUB_WORKSPACE/replay.jsonl" $cell \
            | tee "$GITHUB_WORKSPACE/replay-check.txt"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-cell
          path: |
            results.txt
            verdict.txt
            replay.jsonl
            replay-check.txt
            ns3-stderr.log
            time-v.log
          retention-days: 30
      - name: Compact result block (cheap to fetch via get_job_logs tail)
        if: always()
        shell: bash
        run: |
          f="$GITHUB_WORKSPACE/results.txt"
          [ -f "$f" ] || { echo "FAIL: no results file"; exit 1; }
          grep -E '^(##RUN##|##BENCH##|protocol|[a-z][a-z-]+ +[0-9])' "$f" | tail -n 40 || true
          if ! grep -qE '^(##RUN##|[a-z][a-z-]+ +[0-9])' "$f"; then
            echo "FAIL: no result rows (#28)"; exit 1
          fi
          tail -n 1 "$GITHUB_WORKSPACE/verdict.txt" 2>/dev/null || true
          echo "$AHN_PROV"

  pr:
    name: Open a PR with the cell
    needs: [cell, verdict, legacy]
    if: ${{ always() && inputs.open_pr && (needs.legacy.result == 'success' || (needs.cell.result == 'success' && needs.verdict.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      # `if:` cannot read secrets; whether the org App is configured can.
      ORG_APP: ${{ secrets.BOT_APP_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # #705: an app token, when configured, so the PR's push starts CI: the
      # org App first (swarm-routing/.github#21), then this repository's app.
      # One that cannot make its token is a warning, and the next is tried.
      - name: Org GitHub App token
        id: org
        if: ${{ env.ORG_APP == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: swarm-routing
          # only this repository, only what the PR needs (the App's own grant caps it)
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Repository GitHub App token
        id: ahn
        if: ${{ steps.org.outputs.token == '' && vars.AHN_BOT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          private-key: ${{ secrets.AHN_BOT_APP_KEY }}
      - name: Pick the token
        id: app
        env:
          ORG_TOKEN: ${{ steps.org.outputs.token }}
          ORG_SLUG: ${{ steps.org.outputs.app-slug }}
          AHN_TOKEN: ${{ steps.ahn.outputs.token }}
          AHN_SLUG: ${{ steps.ahn.outputs.app-slug }}
          ORG_FAILED: ${{ steps.org.outcome == 'failure' }}
          AHN_FAILED: ${{ steps.ahn.outcome == 'failure' }}
        run: |
          if [ "$ORG_FAILED" = true ]; then echo "::warning::bot token: the org GitHub App token could not be made; trying the next token"; fi
          if [ "$AHN_FAILED" = true ]; then echo "::warning::bot token: the AHN_BOT_APP_ID token could not be made; trying the next token"; fi
          if [ -n "$ORG_TOKEN" ]; then token="$ORG_TOKEN" slug="$ORG_SLUG" what="org GitHub App"
          elif [ -n "$AHN_TOKEN" ]; then token="$AHN_TOKEN" slug="$AHN_SLUG" what="repository GitHub App"
          else
            echo "::notice::No bot app token (BOT_APP_ID/BOT_APP_PRIVATE_KEY or AHN_BOT_APP_ID/AHN_BOT_APP_KEY, #705); the PR is opened with GITHUB_TOKEN and CI will not run on it."
            exit 0
          fi
          login="${slug}[bot]"
          id=$(GH_TOKEN="$token" gh api "users/${slug}%5Bbot%5D" --jq .id) || id=
          echo "token=$token" >> "$GITHUB_OUTPUT"
          if [ -n "$id" ]; then
            printf 'git-name=%s\ngit-email=%s\n' "$login" "${id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::bot token: $what $login"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      # The cell (both paths) and, on the image path, its separate verdict.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchmark-cell*
          merge-multiple: true
          path: ${{ runner.temp }}/cell
      - name: Commit the cell on a branch and open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          GIT_NAME: ${{ steps.app.outputs.git-name || 'github-actions[bot]' }}
          GIT_EMAIL: ${{ steps.app.outputs.git-email || '41898282+github-actions[bot]@users.noreply.github.com' }}
          CELL: ${{ inputs.cell }}
          REPLAY: ${{ inputs.replay }}
          TITLE: ${{ inputs.title }}
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
          LEGACY_IMAGE: ${{ inputs.legacy_image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          dir="$RUNNER_TEMP/cell"
          name="${CELL:-replay-${REPLAY}}"
          branch="bench/${name}-${GITHUB_RUN_ID}"
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git switch -c "$branch"
          added=""
          # The commit the numbers were measured at: source_sha, as ##PROV##
          # commit= says (#905).
          measured=$SOURCE_SHA
          if [ -n "$CELL" ]; then
            # The cell format the pages cite: a one-line header, then the
            # harness output (its ##CONFIG##/##RUN## rows), then ##ARGS##/##PROV##.
            dest="results/cells/${CELL}.txt"
            { echo "# ${TITLE:-$CELL} @${measured:0:8} run ${GITHUB_RUN_ID} (benchmark-cell.yml, #612)"
              cat "$dir/results.txt"; } > "$dest"
            git add "$dest"; added="\`${dest}\`"
          fi
          if [ -n "$REPLAY" ]; then
            mkdir -p results/replay
            cp "$dir/replay.jsonl" "results/replay/${REPLAY}.jsonl"
            git add "results/replay/${REPLAY}.jsonl"; added="${added:+$added and }\`results/replay/${REPLAY}.jsonl\`"
          fi
          # A re-recorded result can equal what main already holds (v2.3.0's
          # VANET replay: quiet mode never engages on that seed, so the run is
          # byte-identical). Nothing to propose then; say so and stop green.
          if git diff --cached --quiet; then
            echo "::notice::${added} unchanged: main already holds this run byte for byte; no PR opened"
            exit 0
          fi
          git commit -q -m "docs(bench): add ${name} (run ${GITHUB_RUN_ID})"
          git push -q origin "$branch"
          verdict=$(cat "$dir/verdict.txt" 2>/dev/null || echo "no verdict (scenario_check did not run)")
          check=$(cat "$dir/replay-check.txt" 2>/dev/null || echo "no replay recorded")
          body=$(printf '%s\n' \
            "Adds ${added} from [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            "" "**Dispatch:** \`${HARNESS} ${ARGS}\` on \`${IMAGE:-${LEGACY_IMAGE:-ghcr.io/swarm-routing/ns3:${VERSION}}}\` at ${measured} (workflow ${GITHUB_SHA})." \
            "" "**scenario_check results:**" '```' "$verdict" '```' \
            "" "**check-viz-trace (#641):**" '```' "$check" '```' \
            "" "$(if [ "$APP_TOKEN" = true ]; then echo "Opened by benchmark-cell.yml (#612) with the app token (#705); CI runs on this PR."; else echo "Opened by benchmark-cell.yml (#612). CI does not run on a workflow-opened PR (no app token configured, #705); close and reopen it to run checks."; fi)")
          if ! gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
                 --title "docs(bench): add ${name} (run ${GITHUB_RUN_ID})" --body "$body"; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
            echo "::warning::could not open the PR (is 'Allow GitHub Actions to create pull requests' off?). The branch is pushed: $url"
            echo "Branch pushed; open the PR here: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
