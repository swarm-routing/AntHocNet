name: Benchmark cell

# One benchmark workflow for every harness (#612). It runs one cell (one
# harness invocation, any number of seeds) and, if asked, opens a PR that
# adds the cell to results/cells/ with its provenance and its scenario_check
# verdict. That replaces the "save the artifact, rebuild the provenance,
# commit by hand" loop.
#
# Every dispatch shape of the older workflows (removed in v2.5.0, #746) fits
# here, because `args` is the harness's own command line:
#   paper-benchmark.yml      harness=anthocnet-compare, args = its flags
#                            (--scenario=paper --runs=20 ... --diag)
#   satellite-benchmark.yml  harness=isl-grid | leo-walker, args = the flags
#                            those inputs expanded to, plus extraArgs
#   scenario-matrix.yml      one dispatch per sweep point; a sweep is a set
#                            of cells (tools/bench/campaign.py dispatches sets)
# campaign.py translates committed plans that still name the old workflows
# into these inputs. rescue-artifacts.yml is recovery, not a dispatch shape,
# and stays.
#
# The bot PR is opened with a GitHub App installation token when the
# repository has one configured (#705): variable AHN_BOT_APP_ID and secret
# AHN_BOT_APP_KEY, for an app with contents: write and pull-requests: write
# on this repository. Pushes and PRs made with an app token start the normal
# PR workflows, so the cell PR gets CI (lint, the replay check) and can
# auto-merge (#616). Without them the job falls back to the workflow's own
# token, with two consequences:
# - it needs the repository setting "Allow GitHub Actions to create and
#   approve pull requests"; without it the branch is still pushed, and the
#   job summary links it;
# - CI does not run on a PR a workflow token opens; close and reopen it if a
#   check is wanted. The job prints a notice saying so.
#
# Two ways to run a cell (#866, swarm-routing/.github#107):
# - `image` (a campaign): the digest of a campaign image campaign-image.yml
#   built, ghcr.io/swarm-routing/anthocnet-ns3-campaign@sha256:... The job
#   runs in that image, checks out the commit the image was built from (its
#   org.opencontainers.image.revision label) and runs the harness with
#   `./ns3 run --no-build`: no cell rebuilds the module, so every cell of a
#   campaign runs one binary. ##PROV## names the image digest, the ns3-dev
#   base digest and the modules' commits, read from the image's labels.
# - no `image` (legacy, to replay a published cell): the job runs in this
#   repo's historical ghcr.io/swarm-routing/ns3:<version> image (3.36, 3.41,
#   3.42, 3.42-opt, 3.47, 3.48; frozen since images.yml was retired) and
#   installs, configures and builds the module in the job, as before.
#   Published cells name ghcr.io/danieljoppi/ns3:<version>, the same recipe
#   built before the org transfer; those tags are frozen
#   (swarm-routing/.github#110) and no workflow pulls them.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: 'routing-compare or its alias anthocnet-compare (MANET/mesh/FANET/VANET) | isl-grid | leo-walker (ns-3 >= 3.48)'
        type: choice
        options: [anthocnet-compare, routing-compare, isl-grid, leo-walker]
        default: anthocnet-compare
      args:
        description: 'The harness flags, verbatim (e.g. --scenario=paper --runs=20 --protocols=anthocnet,aodv,olsr,dsdv,oracle --diag)'
        required: true
      version:
        description: 'Legacy path only (no image): ghcr.io/swarm-routing/ns3:<version>, e.g. 3.42-opt; 3.48 for leo-walker'
        default: '3.42-opt'
      image:
        description: 'Campaign image by digest (campaign-image.yml): ghcr.io/swarm-routing/anthocnet-ns3-campaign@sha256:...; empty = the legacy in-job build'
        default: ''
      cell:
        description: 'Cell name: the PR adds results/cells/<cell>.txt (required with open_pr)'
        default: ''
      title:
        description: "One line for the cell's header, e.g. 'static mesh (paper field, pause=900, disk) 20 seeds'"
        default: ''
      replay:
        description: 'ns-3 replay id (#641: manet, mesh, fanet, vanet, isl, leo): also record the first anthocnet run with --vizTrace; the PR adds results/replay/<id>.jsonl'
        default: ''
      published:
        description: 'With replay: the published cell the trace must match (results/cells/<name>.txt, checked by check-viz-trace.py)'
        default: ''
      open_pr:
        description: 'Open a PR adding the cell and/or the replay trace (with provenance and the checks)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  # The campaign image's labels, read on the host (a container cannot see its
  # own labels): its commit, base digest and modules, for the checkout and
  # ##PROV##. Nothing to do on the legacy path.
  inspect:
    name: image labels
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.labels.outputs.commit }}
      base_digest: ${{ steps.labels.outputs.base_digest }}
      base_tag: ${{ steps.labels.outputs.base_tag }}
      modules: ${{ steps.labels.outputs.modules }}
      deps: ${{ steps.labels.outputs.deps }}
    steps:
      - name: Read the campaign image's labels
        id: labels
        if: ${{ inputs.image != '' }}
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A campaign image is pinned by digest, never by a tag.
          [[ "$IMAGE" =~ ^ghcr\.io/${OWNER,,}/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::image must be ghcr.io/${OWNER,,}/<name>@sha256:<64 hex> (got '$IMAGE')"; exit 1; }
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' > "$RUNNER_TEMP/image.json"
          python3 - "$RUNNER_TEMP/image.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          img = json.load(open(sys.argv[1]))
          if "config" not in img:  # an index: one config per platform
              img = img.get("linux/amd64") or next(iter(img.values()))
          lab = img["config"].get("Labels") or {}
          def need(key, pattern):
              v = lab.get(key, "")
              if not re.fullmatch(pattern, v):
                  sys.exit(f"::error::label {key}={v!r} is missing or malformed: not a campaign image?")
              return v
          src = need("org.opencontainers.image.source", r"\S+")
          if src != os.environ["SOURCE"]:
              sys.exit(f"::error::the image was built from {src}, not {os.environ['SOURCE']}")
          print("commit=" + need("org.opencontainers.image.revision", r"[0-9a-f]{40}"))
          print("base_digest=" + need("io.github.swarm-routing.ns3-dev.digest", r"sha256:[0-9a-f]{64}"))
          print("base_tag=" + need("io.github.swarm-routing.ns3-dev.tag", r"\S+"))
          print("modules=" + ",".join(need("io.github.swarm-routing.modules", r"[\w -]+").split()))
          print("deps=" + (lab.get("io.github.swarm-routing.dependencies") or "none"))
          PY
          cat "$GITHUB_OUTPUT"

  run:
    name: ${{ inputs.harness }} ${{ inputs.cell }}
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 360   # the hosted-runner ceiling (#121)
    container:
      image: ${{ inputs.image || format('ghcr.io/swarm-routing/ns3:{0}', inputs.version) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A campaign image: the tools and fixtures of the commit its modules
          # were built from, so the binary and scenario_check agree.
          ref: ${{ needs.inspect.outputs.commit || github.sha }}
      - name: Check the inputs
        env:
          CELL: ${{ inputs.cell }}
          REPLAY: ${{ inputs.replay }}
          OPEN_PR: ${{ inputs.open_pr }}
        run: |
          for v in "$CELL" "$REPLAY"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[a-z0-9][a-z0-9.-]*$'; then
              echo "names must be [a-z0-9.-] (got '$v')"; exit 1
            fi
          done
          if [ "$OPEN_PR" = "true" ] && [ -z "$CELL$REPLAY" ]; then
            echo "open_pr needs a cell and/or a replay name"; exit 1
          fi
      - name: Install AntHocNet module
        if: ${{ inputs.image == '' }}
        run: make install-ns3 NS3DIR=/opt/ns-3
      - name: Resolve ns-3 build profile (#123)
        # State the image's profile explicitly, so the legacy reconfigure
        # never downgrades an optimized image, and a campaign image's profile
        # is in the log and in ##PROV##.
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          env_file=/opt/ns-3/.swarm-configure.env
          devprof=""
          if [ -f "$env_file" ]; then
            # An ns3-dev image (swarm-routing/ns3-containers) records the
            # configure flags it was built with; BUILD_PROFILE=optimized is
            # ns-3's `-d release` there (never ns-3's own `optimized`).
            # shellcheck disable=SC1090
            . "$env_file"
            devprof=${BUILD_PROFILE:-}
            flag=$NS3_PROFILE_FLAGS
            profile=$(printf '%s\n' "$flag" | sed -n 's/.*-d \([a-z]*\).*/\1/p')
            [ -n "$profile" ] || { echo "::error::no -d <profile> in NS3_PROFILE_FLAGS='$flag' ($env_file)"; exit 1; }
            src="$env_file: BUILD_PROFILE=$BUILD_PROFILE NS3_PROFILE_FLAGS='$flag'"
          elif [ -n "${NS3_PROFILE:-}" ]; then
            # This repo's historical images (docker/Dockerfile.ns3, retired).
            profile=$NS3_PROFILE; src="NS3_PROFILE=$NS3_PROFILE (image environment)"
          else
            case "$VERSION_TAG" in *-opt) profile=release ;; *) profile=default ;; esac
            src="tag suffix of ns3:$VERSION_TAG"
          fi
          if [ -z "${flag+x}" ]; then
            flag=""
            [ "$profile" = "default" ] || flag="-d $profile"
          fi
          if [ -n "$IMAGE" ] && [ "$profile" != "release" ]; then
            echo "::warning::campaign image built in ns-3 profile '$profile', not release (optimized)"
          fi
          echo "ns-3 build profile: $profile (from $src)"
          {
            echo "NS3_PROFILE=$profile"
            echo "NS3_PROFILE_FLAG=$flag"
            echo "NS3_BUILD_PROFILE=$devprof"
          } >> "$GITHUB_ENV"
      - name: Check the campaign image (no in-job build)
        if: ${{ inputs.image != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/ns-3
          for m in anthocnet routing-bench; do
            [ -e "contrib/$m" ] || { echo "::error::contrib/$m is not in the image"; exit 1; }
          done
          shown=$(./ns3 show profile)
          echo "$shown"
          grep -qi "build profile: $NS3_PROFILE" <<<"$shown" \
            || { echo "::error::the built tree's profile is not '$NS3_PROFILE'"; exit 1; }
      - name: Configure and build
        if: ${{ inputs.image == '' }}
        run: |
          cd /opt/ns-3
          # $NS3_PROFILE_FLAG unquoted on purpose: empty must expand to nothing.
          ./ns3 configure $NS3_PROFILE_FLAG --enable-examples \
            --enable-modules='anthocnet;aomdv;gpsr;oracle;adaptive;routing-bench;wifi;mobility;applications;csma;aodv;olsr;dsdv;flow-monitor;point-to-point;mesh'
          ./ns3 build && ./ns3 show profile
      - name: Run the cell
        # Stop the run 20 min before the job ceiling, so
        # the always() steps still upload the stderr tail and a stub results
        # file that campaign.py collect recognises as a missing run (#746).
        timeout-minutes: 340
        shell: bash
        env:
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          REPLAY: ${{ inputs.replay }}
          IMAGE: ${{ inputs.image }}
        run: |
          cd /opt/ns-3
          set -o pipefail
          # A plan names repo fixtures as $GITHUB_WORKSPACE/... (the disaster
          # trace, the Termite anchor flows). The input arrives as literal
          # text, so expand that one variable here; ##ARGS## keeps the literal.
          ARGS="${ARGS//\$GITHUB_WORKSPACE/$GITHUB_WORKSPACE}"
          [ -n "$REPLAY" ] && ARGS="$ARGS --vizTrace=$GITHUB_WORKSPACE/replay.jsonl"
          timewrap=""
          [ -x /usr/bin/time ] && timewrap="/usr/bin/time -v -o $GITHUB_WORKSPACE/time-v.log"
          # #256: cap the address space below the
          # runner's, so an over-large cell dies by bad_alloc and keeps its logs.
          ulimit -v 13631488 || true
          # A campaign image is already built: never rebuild in a cell.
          nobuild=""
          [ -n "$IMAGE" ] && nobuild="--no-build"
          echo "running: $HARNESS $ARGS${nobuild:+ ($nobuild)}"
          # $timewrap and $nobuild unquoted on purpose: empty must expand to nothing.
          $timewrap ./ns3 run $nobuild "$HARNESS $ARGS" 2>"$GITHUB_WORKSPACE/ns3-stderr.log" \
            | tee "$GITHUB_WORKSPACE/results.txt" \
            || { echo "--- ns-3 run FAILED; stderr tail ---"; tail -n 60 "$GITHUB_WORKSPACE/ns3-stderr.log"; exit 1; }
      - name: Stamp provenance into the results file (#674)
        if: always()
        shell: bash
        env:
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          VERSION_TAG: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
          IMAGE_COMMIT: ${{ needs.inspect.outputs.commit }}
          BASE_DIGEST: ${{ needs.inspect.outputs.base_digest }}
          BASE_TAG: ${{ needs.inspect.outputs.base_tag }}
          MODULES: ${{ needs.inspect.outputs.modules }}
          DEPS: ${{ needs.inspect.outputs.deps }}
        run: |
          # Append-only (methodology "Measuring commit"): the first seven
          # fields keep their meaning; a campaign image adds its digests and
          # the commit of every module in it (commit= is the image's own
          # revision, which is also what this job checked out).
          if [ -n "$IMAGE" ]; then
            prov="##PROV## commit=$IMAGE_COMMIT ref=$GITHUB_REF_NAME run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT image=$IMAGE profile=$NS3_PROFILE harness=$HARNESS"
            prov="$prov image_digest=${IMAGE#*@} base_digest=$BASE_DIGEST base=$BASE_TAG build_profile=$NS3_BUILD_PROFILE modules=$MODULES deps=$DEPS workflow_commit=$GITHUB_SHA"
          else
            prov="##PROV## commit=$GITHUB_SHA ref=$GITHUB_REF_NAME run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT image=ghcr.io/swarm-routing/ns3:$VERSION_TAG profile=$NS3_PROFILE harness=$HARNESS"
          fi
          echo "AHN_PROV=$prov" >> "$GITHUB_ENV"
          if [ -f "$GITHUB_WORKSPACE/results.txt" ]; then
            echo "##ARGS## $HARNESS $ARGS" >> "$GITHUB_WORKSPACE/results.txt"
            echo "$prov" >> "$GITHUB_WORKSPACE/results.txt"
          fi
      - name: scenario_check verdict
        if: always()
        shell: bash
        run: |
          [ -f "$GITHUB_WORKSPACE/results.txt" ] || exit 0
          python3 tools/bench/scenario_check.py results "$GITHUB_WORKSPACE/results.txt" \
            | tee "$GITHUB_WORKSPACE/verdict.txt"
      - name: Check the replay trace against the published cell (#641)
        if: ${{ inputs.replay != '' }}
        shell: bash
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          cell=""
          [ -n "$PUBLISHED" ] && cell="--cell results/cells/${PUBLISHED}.txt"
          # $cell unquoted on purpose: empty must expand to nothing.
          python3 tools/bench/check-viz-trace.py "$GITHUB_WORKSPACE/replay.jsonl" $cell \
            | tee "$GITHUB_WORKSPACE/replay-check.txt"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-cell
          path: |
            results.txt
            verdict.txt
            replay.jsonl
            replay-check.txt
            ns3-stderr.log
            time-v.log
          retention-days: 30
      - name: Compact result block (cheap to fetch via get_job_logs tail)
        if: always()
        shell: bash
        run: |
          f="$GITHUB_WORKSPACE/results.txt"
          [ -f "$f" ] || { echo "FAIL: no results file"; exit 1; }
          grep -E '^(##RUN##|##BENCH##|protocol|[a-z][a-z-]+ +[0-9])' "$f" | tail -n 40 || true
          if ! grep -qE '^(##RUN##|[a-z][a-z-]+ +[0-9])' "$f"; then
            echo "FAIL: no result rows (#28)"; exit 1
          fi
          tail -n 1 "$GITHUB_WORKSPACE/verdict.txt" 2>/dev/null || true
          echo "$AHN_PROV"

  pr:
    name: Open a PR with the cell
    needs: run
    if: ${{ inputs.open_pr }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # #705: an app token, when configured, so the PR's push starts CI.
      - name: GitHub App token
        id: app
        if: ${{ vars.AHN_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          private-key: ${{ secrets.AHN_BOT_APP_KEY }}
      - name: Token notice
        if: ${{ steps.app.outputs.token == '' }}
        run: echo "::notice::No AHN_BOT_APP_ID/AHN_BOT_APP_KEY configured (#705); the PR is opened with GITHUB_TOKEN and CI will not run on it."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-cell
          path: ${{ runner.temp }}/cell
      - name: Commit the cell on a branch and open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          CELL: ${{ inputs.cell }}
          REPLAY: ${{ inputs.replay }}
          TITLE: ${{ inputs.title }}
          HARNESS: ${{ inputs.harness }}
          ARGS: ${{ inputs.args }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          dir="$RUNNER_TEMP/cell"
          name="${CELL:-replay-${REPLAY}}"
          branch="bench/${name}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          added=""
          if [ -n "$CELL" ]; then
            # The cell format the pages cite: a one-line header, then the
            # harness output (its ##CONFIG##/##RUN## rows), then ##ARGS##/##PROV##.
            dest="results/cells/${CELL}.txt"
            { echo "# ${TITLE:-$CELL} @${GITHUB_SHA:0:8} run ${GITHUB_RUN_ID} (benchmark-cell.yml, #612)"
              cat "$dir/results.txt"; } > "$dest"
            git add "$dest"; added="\`${dest}\`"
          fi
          if [ -n "$REPLAY" ]; then
            mkdir -p results/replay
            cp "$dir/replay.jsonl" "results/replay/${REPLAY}.jsonl"
            git add "results/replay/${REPLAY}.jsonl"; added="${added:+$added and }\`results/replay/${REPLAY}.jsonl\`"
          fi
          # A re-recorded result can equal what main already holds (v2.3.0's
          # VANET replay: quiet mode never engages on that seed, so the run is
          # byte-identical). Nothing to propose then; say so and stop green.
          if git diff --cached --quiet; then
            echo "::notice::${added} unchanged: main already holds this run byte for byte; no PR opened"
            exit 0
          fi
          git commit -q -m "docs(bench): add ${name} (run ${GITHUB_RUN_ID})"
          git push -q origin "$branch"
          verdict=$(cat "$dir/verdict.txt" 2>/dev/null || echo "no verdict (scenario_check did not run)")
          check=$(cat "$dir/replay-check.txt" 2>/dev/null || echo "no replay recorded")
          body=$(printf '%s\n' \
            "Adds ${added} from [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            "" "**Dispatch:** \`${HARNESS} ${ARGS}\` on \`${IMAGE:-ghcr.io/swarm-routing/ns3:${VERSION}}\` at ${GITHUB_SHA}." \
            "" "**scenario_check results:**" '```' "$verdict" '```' \
            "" "**check-viz-trace (#641):**" '```' "$check" '```' \
            "" "$(if [ "$APP_TOKEN" = true ]; then echo "Opened by benchmark-cell.yml (#612) with the app token (#705); CI runs on this PR."; else echo "Opened by benchmark-cell.yml (#612). CI does not run on a workflow-opened PR (no app token configured, #705); close and reopen it to run checks."; fi)")
          if ! gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
                 --title "docs(bench): add ${name} (run ${GITHUB_RUN_ID})" --body "$body"; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
            echo "::warning::could not open the PR (is 'Allow GitHub Actions to create pull requests' off?). The branch is pushed: $url"
            echo "Branch pushed; open the PR here: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
