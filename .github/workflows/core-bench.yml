name: Core speed

# Core speed benchmarks (#620): ns/op of the core's hot paths with no
# simulator (core/bench/bench_core.cpp, `make bench-core`).
#
# On a PR that touches core/: build the base branch and the PR head on the same
# runner, run them interleaved three times each, and put the comparison in the
# job summary. A case more than 25 % slower gets a ::warning:: annotation; the
# job never fails on a number, because shared runners are noisy.
#
# On main: run once, append the numbers to results/core-bench/history.csv with
# the commit and the runner's CPU model (only comparable within one model),
# redraw docs/benchmarks/charts/core-speed.png, and open or update the PR from
# bot/core-bench with both (.github/actions/bot-pr; main takes no direct push,
# #789). While that PR is open, the next run appends to its history, so no
# measured row is lost before a merge.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'tools/bench/core_bench.py'
      - '.github/workflows/core-bench.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tools/bench/core_bench.py'
      - '.github/workflows/core-bench.yml'
  workflow_dispatch:

# Read-only by default; each job that writes declares its own scopes
# below (Scorecard Token-Permissions, #785).
permissions:
  contents: read

concurrency:
  group: core-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Core speed benchmarks
    runs-on: ubuntu-24.04
    # contents + pull-requests: write only to open the history PR with the
    # workflow token when no bot token is configured (#789, #705).
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the PR head (or main)
        run: |
          cmake -S core -B "$RUNNER_TEMP/head" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/head" -j --target bench_core
      - name: Build the base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base-src" "$BASE"
          if [ ! -f "$RUNNER_TEMP/base-src/core/bench/bench_core.cpp" ]; then
            echo "The base branch has no core/bench yet; nothing to compare against."
            echo "NO_BASE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          cmake -S "$RUNNER_TEMP/base-src/core" -B "$RUNNER_TEMP/base" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/base" -j --target bench_core
      - name: Compare against the base, interleaved (PR only)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          for i in 1 2 3; do
            [ -n "${NO_BASE:-}" ] || "$RUNNER_TEMP/base/bench_core" --csv > "$RUNNER_TEMP/runs/base-$i.csv"
            "$RUNNER_TEMP/head/bench_core" --csv > "$RUNNER_TEMP/runs/head-$i.csv"
          done
          {
            echo "## Core speed: this PR against its base"
            echo
            echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo
            if [ -n "${NO_BASE:-}" ]; then
              cat "$RUNNER_TEMP/runs/head-1.csv"
            else
              python3 tools/bench/core_bench.py compare \
                --base "$RUNNER_TEMP"/runs/base-*.csv --head "$RUNNER_TEMP"/runs/head-*.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - name: Install pinned matplotlib
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/python-tools
        with:
          packages: matplotlib
      - name: Record and chart (main only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rows still waiting in an open bot/core-bench PR are kept: start
          # from that branch's history, not main's (only this job writes it).
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:bot/core-bench" --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            git fetch -q origin bot/core-bench
            git checkout FETCH_HEAD -- results/core-bench/history.csv
            echo "Appending to the history of open PR #$open."
          fi
          "$RUNNER_TEMP/head/bench_core" --csv | tee "$RUNNER_TEMP/run.csv"
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
          python3 tools/bench/core_bench.py record "$RUNNER_TEMP/run.csv" \
            --commit "$GITHUB_SHA" --date "$(date -u +%F)" --cpu "$cpu"
          python3 tools/bench/core_bench.py chart
      - name: Open or update the core-speed PR (main only)
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/bot-pr
        with:
          branch: bot/core-bench
          title: 'chore(core-bench): record core speed benchmarks'
          body: Core speed (`bench_core`, ns/op) measured at ${{ github.sha }}, appended to `results/core-bench/history.csv`, and `docs/benchmarks/charts/core-speed.png` redrawn (#620).
          paths: results/core-bench/history.csv docs/benchmarks/charts/core-speed.png
          labels: benchmark
          org-app-id: ${{ secrets.BOT_APP_ID }}
          org-app-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          app-id: ${{ vars.AHN_BOT_APP_ID }}
          app-key: ${{ secrets.AHN_BOT_APP_KEY }}
          token: ${{ secrets.ORG_BOT_TOKEN }}
