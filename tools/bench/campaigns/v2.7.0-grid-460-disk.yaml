    blocks: [1, 11]
  grid-gaussmarkov-nakagami:
    workflow: benchmark-cell.yml
    inputs: {harness: routing-compare, args: "--scenario=paper --runs=10 --nNodes=50 --time=900 --areaX=1500 --areaY=300 --speed=20 --range=300 --pause=0 --propagation=nakagami --diag --mobility=gaussmarkov --transport=udp --protocols=anthocnet,aodv,olsr,dsdv,oracle --ns3::oracle::Topology::LinkRangeM=300"}
    blocks: [1, 11]

