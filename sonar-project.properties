# SonarQube Cloud analysis, run by .github/workflows/quality.yml (CI-based
# analysis: the project's Automatic Analysis must be off).
sonar.organization=swarm-routing
sonar.projectKey=swarm-routing_AntHocNet
sonar.sourceEncoding=UTF-8

# AntHocNet's own C++: the simulator-free core, the ns-3 module and the
# routing-bench comparison harness (ADR-0027). The vendored and comparator arms
# under ns3/baselines/ (AOMDV and GPSR are third-party ports), the learn site,
# docs, results and the paper are not analysed. Upstream ns-3 (/opt/ns-3 in
# CI) lies outside this base directory, so it is never indexed.
sonar.sources=core/src,core/include,ns3/anthocnet/model,ns3/anthocnet/helper,ns3/routing-bench/model,ns3/routing-bench/helper
sonar.tests=core/tests,core/bench,ns3/anthocnet/test,ns3/anthocnet/examples,ns3/routing-bench/test,ns3/routing-bench/examples
sonar.exclusions=ns3/baselines/**,web/**,build/**,**/build*/**,results/**,docs/**,paper/**
sonar.test.exclusions=core/tests/fuzz_corpus/**

# Merged by quality.yml from the core build and the ns-3 tree, with every
# file mapped back to its path in this checkout.
sonar.cfamily.compile-commands=build/compile_commands.json
# gcovr --sonarqube (generic coverage format), paths relative to the root.
sonar.coverageReportPaths=coverage-sonar.xml
