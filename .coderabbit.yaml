# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# org-sync:begin coderabbit-head
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings (org decision 2026-11-01, swarm-routing/ns3-containers#18):
# the per-PR AI reviewer for every public swarm-routing repository. Comments
# only: it never approves or requests changes, and it is not a required check.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  # Review budget (org decision 2026-11-02, swarm-routing/.github#37): review
  # each PR once when it opens; re-review on request (`@coderabbitai review`),
  # not on every push. Skip Dependabot bumps, which CI already checks.
  # (No title filter: ignore_title_keywords matches anywhere in a title, so
  # "style:" would also skip e.g. "fix: keep style: attributes".)
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    ignore_usernames:
      - "dependabot[bot]"
  path_filters:
    - "!**/*.pdf"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Review against this repository's AGENTS.md (golden rules) and the org rules in
        swarm-routing/.github CONTRIBUTING.md. Flag a broken invariant as a blocking
        issue; keep style nits minimal (clang-format, ruff, actionlint and shellcheck
        already run in CI).
    - path: "**/*.{h,hpp,cc,cpp,py,sh}"
      instructions: >-
        Every original source file starts with `Copyright (c) 2026 Daniel Joppi
        (https://github.com/swarm-routing)` and an SPDX-License-Identifier that
        matches its directory's row in LICENSING.md: `MIT OR GPL-2.0-only` for a
        simulator-free core/ and standalone tooling, `GPL-2.0-only` for ns-3 modules,
        the site, docs and data. An outside contributor may add their own
        `Copyright (c) <year> <Name>` line beneath the org line (never instead of
        it). A new directory needs its LICENSING.md row in the same PR. Dual-licensed code must never include or import GPL-only code. Flag
        any code that looks copied from ns-3's src/aodv or src/olsr.
    - path: ".github/workflows/**"
      instructions: >-
        Third-party actions are pinned by full commit SHA with a `# vX.Y.Z` comment;
        the org's own workflows (any `uses: swarm-routing/.github/.github/workflows/*`,
        e.g. reusable-*.yml, sync-labels.yml) are called at @main by maintainer
        decision (2026-11-02, swarm-routing/.github rule 10), so do not ask to
        SHA-pin them. Permissions
        are minimal; transient artifacts use retention-days <= 7. Automatic CI targets
        ghcr.io/swarm-routing/ns3-dev:latest-<profile> (the ns-3 release ns-3
        supports); older ns-3 releases only on demand via workflow_dispatch (org
        invariant 7). CI never uses the `optimized` image.
    - path: "**/*.md"
      instructions: >-
        Docs are for ns-3 developers: commands must be runnable and exact; no invented
        numbers, DOIs or citations; paywalled papers never committed to public
        repositories.
# org-sync:end coderabbit-head
    # AntHocNet: generated data are not reviewed line by line (the org head has
    # no extension point for path_filters, so they are instructions, not filters;
    # CodeRabbit already skips images and CSVs by default).
    - path: "{results/**,requirements/*.txt}"
      instructions: >-
        Committed benchmark data and hash-pinned lockfiles
        (uv pip compile): do not review line by line; check only that the PR
        says how they were regenerated.
    # AntHocNet: the golden rules (AGENTS.md) a reviewer has to check by reading.
    - path: "core/**"
      instructions: >-
        Golden rules 1, 3, 5, 7, 8: no simulator header (ns-3, emscripten) anywhere
        in core/; randomness only through IRng and time only through IClock, never
        rand() or a clock read; the visited path and the (src,seq) history stay
        capped by Config::maxPathLength / maxHistory; C++14. A core logic change
        comes with a unit test in core/tests/. A new mechanism ships behind a
        default-off Config switch and leaves the default path byte-identical
        (ADR-0019, ADR-0020); never a per-network preset.
    - path: "core/**/ant_message_codec*"
      instructions: >-
        Golden rule 4: a change to an AntMessage field, or to the units or meaning
        of one, bumps kWireVersion and updates, in the same field order, the codec,
        the ns-3 AntHeader (ns3/anthocnet/model/anthocnet-packet.*), the round-trip
        tests (core/tests/test_codec.cpp and the ns-3 suite) and docs/wire-format.md.
    - path: "ns3/anthocnet/model/anthocnet-packet*"
      instructions: >-
        Golden rule 4: the AntHeader mirrors core's ant_message_codec field for
        field; a layout change bumps kWireVersion and lands with the codec, its
        tests and docs/wire-format.md.
    - path: "ns3/**"
      instructions: >-
        Golden rule 2: an adapter only converts its header to and from
        core::AntMessage, carries out the RouteDecisions the core returns, and owns
        the timers and the pending-packet queue; flag any routing logic added here.
        Cross-version ns-3 API drift is gated with the existing AHN_* /
        ANTHOCNET_NS3_* macros, not forked.
    - path: ".github/workflows/*.yml"
      instructions: >-
        AntHocNet: permissions are least-privilege per job (#785). The ns-3 legs
        pinned to 3.48 instead of latest are the labelled, temporary #843 exception
        (ns-3.49's AODV livelock); do not flag those, but flag any new automatic
        run on an older ns-3. A job that can hang carries timeout-minutes (#840).
    - path: "tools/**"
      instructions: >-
        Golden rule 10: nothing shipped depends on .claude/; a script a workflow,
        a release or a doc needs lives in tools/ (ADR-0014). A gate in
        tools/checks/ keeps its verdict on committed data unless the PR says it
        changes it; ns-3 version differences are probed (./ns3 configure --help),
        not assumed.
# org-sync:begin coderabbit-tail
  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSING.md"
chat:
  auto_reply: true
# org-sync:end coderabbit-tail
